<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NABE">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/m/ikon/180.png">
<link rel="icon" href="/m/ikon/192.png">
<link rel="manifest" href="/m/manifest.webmanifest">
<title>NABE</title>
<style>
/* NABE på telefonen, i iOS sitt språk: store titler, grupperte lister, widgets, gjennomsiktig fanelinje, ark nedenfra.
   Fargene, ansiktet, de rette tekstene og monospace på adresser er NABE sine. */
:root{
  color-scheme:dark light;
  --bg:#000;--gruppe:#1c1c1e;--hev:#2c2c2e;--sep:rgba(84,84,88,.65);
  --fg:#fff;--fg2:rgba(235,235,245,.62);--fg3:rgba(235,235,245,.32);
  --tint:#5aa2ff;--tint-bg:rgba(90,162,255,.16);--ok:#30d158;--warn:#ffd60a;--err:#ff453a;
  --glass:rgba(24,24,26,.74);--felt:rgba(118,118,128,.24);--seg-valgt:#636366;--skygge:0 1px 3px rgba(0,0,0,.4);
  --ark-bg:#1c1c1e;--ark-gruppe:#2c2c2e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f2f2f7;--gruppe:#fff;--hev:#e5e5ea;--sep:rgba(60,60,67,.29);
  --fg:#000;--fg2:rgba(60,60,67,.62);--fg3:rgba(60,60,67,.3);
  --tint:#1f6fe0;--tint-bg:rgba(31,111,224,.12);--ok:#34c759;--warn:#9a6700;--err:#d70015;
  --glass:rgba(249,249,251,.8);--felt:rgba(118,118,128,.12);--seg-valgt:#fff;--skygge:0 1px 3px rgba(0,0,0,.18);
  --ark-bg:#f2f2f7;--ark-gruppe:#fff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.3 var(--sans);-webkit-font-smoothing:antialiased;
  padding:calc(44px + env(safe-area-inset-top)) 0 calc(86px + env(safe-area-inset-bottom));min-height:100vh;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}

/* ---- navigasjonslinjen: gjennomsiktig, tittelen krymper inn når du ruller */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(44px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));
  background:transparent;border-bottom:.5px solid transparent;transition:background .2s,border-color .2s;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
body.skrullet .nav{background:var(--glass);border-bottom-color:var(--sep)}
.nav-venstre,.nav-hoyre{flex:1;display:flex;align-items:center;min-width:0}
.nav-hoyre{justify-content:flex-end}
.nav-tittel{font-weight:600;font-size:17px;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
body.skrullet .nav-tittel{opacity:1}
.nav-tilbake{background:none;border:0;color:var(--tint);display:flex;align-items:center;gap:4px;padding:8px 6px;font-size:17px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nav-tilbake svg{width:11px;height:19px;flex:none}
.nav-tilbake[hidden]{display:none}
.pille{font-size:12px;font-weight:600;color:var(--fg2);background:var(--felt);border-radius:99px;padding:4px 11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pille.skriv{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}

/* ---- store titler */
.stor-tittel{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.37px;margin:6px 20px 4px}
.stor-under{margin:0 20px 16px;font-size:13px;color:var(--fg2);font-family:var(--mono);overflow-wrap:anywhere}
.stor-tittel + .sok,.stor-tittel + .seg,.stor-tittel + .widgets,.stor-tittel + .liste{margin-top:14px}

/* ---- varsler øverst */
.merknad{margin:0 16px 14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--fg);font-size:14px;display:flex;gap:10px;align-items:center}
.merknad span{color:var(--warn);font-size:16px}

/* ---- søkefelt og segmentert kontroll */
.sok{position:relative;margin:0 16px 14px}
.sok svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg2);pointer-events:none}
.sok input{width:100%;height:36px;border:0;border-radius:10px;background:var(--felt);padding:0 12px 0 33px;font-size:17px;-webkit-appearance:none;appearance:none}
.sok input::placeholder{color:var(--fg2)}
.sok input::-webkit-search-cancel-button{-webkit-appearance:none}
.seg{display:flex;margin:0 16px 14px;background:var(--felt);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:30px;border:0;border-radius:7px;background:none;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;transition:background .15s}
.seg button[aria-pressed=true]{background:var(--seg-valgt);box-shadow:var(--skygge);font-weight:600}

/* ---- grupperte lister */
.liste{margin:0 16px 22px;background:var(--gruppe);border-radius:12px;overflow:hidden}
.liste-fot{margin:-14px 20px 22px;font-size:13px;color:var(--fg2)}
.seksjon{margin:22px 20px 7px;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--fg2)}
button.seksjon.gr{display:flex;align-items:center;gap:8px;width:calc(100% - 40px);background:none;border:0;padding:0;text-align:left;font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--fg2);cursor:pointer}
button.seksjon.gr b{font-weight:600;color:var(--fg)}
button.seksjon.gr small{margin-left:auto;font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
button.seksjon.gr i{width:7px;height:7px;border-right:1.5px solid var(--fg3);border-bottom:1.5px solid var(--fg3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:none}
button.seksjon.gr[aria-expanded="false"] i{transform:rotate(-45deg)}
.grvelger{margin:-4px 16px 12px}
.celle{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;width:100%;background:none;border:0;text-align:left;position:relative;color:inherit}
.celle + .celle::before,.celle + label.celle::before,label.celle + .celle::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.celle.med-ikon + .celle.med-ikon::before{left:58px}
button.celle:active{background:var(--hev)}
.ik{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--tint);color:#fff;font:700 11px var(--mono);flex:none;letter-spacing:-.3px}
.ik.ut{background:#ff9f0a}
.ik.enhet{background:var(--tint)}
.ik svg{width:17px;height:17px}
.ct{display:flex;flex-direction:column;min-width:0;flex:1}
.ct1{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct2{font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct2.mono{font-family:var(--mono);font-size:12px}
.suff{font-family:var(--mono);font-size:.62em;color:var(--fg2);font-weight:400}
.systags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stor-under + .systags{margin:2px 16px 12px}
.systag{font-style:normal;font-size:11.5px;color:var(--fg2);padding:2px 8px;border:1px solid var(--line,rgba(128,128,128,.35));border-radius:999px;white-space:nowrap}
.systag b{font-family:var(--mono);font-weight:600;color:var(--fg)}
.lev-ikon{display:inline-block;height:11px;aspect-ratio:var(--ar,1);max-width:56px;vertical-align:-1px;background:currentColor;color:var(--fg2);
  -webkit-mask:var(--li) center/contain no-repeat;mask:var(--li) center/contain no-repeat;-webkit-mask-source-type:luminance;mask-mode:luminance}
.lev-logo{font:700 9px/1 var(--mono);letter-spacing:.08em;padding:2px 5px 1px;border-radius:4px;border:1px solid currentColor;color:var(--fg2);white-space:nowrap}
.cv{margin-left:auto;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:17px;padding-left:8px}
.cv small{font-size:13px;color:var(--fg3);margin-left:2px}
.chev{width:8px;height:14px;color:var(--fg3);flex:none;margin-left:2px}
.celle input,.celle select{margin-left:auto;background:none;border:0;text-align:right;color:var(--tint);font-size:17px;max-width:62%;-webkit-appearance:none;appearance:none;padding:6px 0}
.celle input::placeholder{color:var(--fg3)}
.celle label,label.celle > span:first-child{white-space:nowrap}
.tekstcelle{padding:12px 16px;font-size:15px;line-height:1.5;color:var(--fg2)}

/* ---- widgets for festede punkter */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 22px}
.widget{background:var(--gruppe);border:0;border-radius:20px;padding:14px 15px 13px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  transition:transform .15s,opacity .2s;color:inherit;min-width:0}
.widget:active{transform:scale(.96)}
.w-navn{font-size:13px;font-weight:600;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.w-verdi{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:10px 0 8px;white-space:nowrap}
.w-verdi small{font-size:15px;font-weight:500;color:var(--fg2);margin-left:3px;letter-spacing:0}
.w-enhet{font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.widget.gammel .w-verdi{color:var(--fg3)}

/* ---- tomme tilstander */
.tom{text-align:center;padding:56px 32px 30px;color:var(--fg2)}
.tom svg.ansikt{width:64px;height:64px;margin-bottom:14px;opacity:.9}
.tom h2{margin:0 0 6px;font-size:21px;font-weight:700;color:var(--fg);letter-spacing:.35px}
.tom p{margin:0 auto 18px;max-width:300px;font-size:15px;line-height:1.45}

/* ---- knapper */
.knapp-stor{display:flex;align-items:center;justify-content:center;width:calc(100% - 32px);margin:0 16px 12px;min-height:50px;border-radius:14px;border:0;background:var(--tint);color:#fff;font-size:17px;font-weight:600;transition:opacity .15s}
.knapp-stor:active{opacity:.7}
.knapp-stor.lys{background:var(--tint-bg);color:var(--tint)}
.knapp-stor.fare{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.knapp-stor:disabled{opacity:.4}
.tekstknapp{background:none;border:0;color:var(--tint);font-size:17px;padding:8px 4px;min-width:60px}
.tekstknapp.fet{font-weight:600;text-align:right}
.tekstknapp:active{opacity:.5}
.mini{border:0;border-radius:99px;background:var(--tint-bg);color:var(--tint);font-size:14px;font-weight:600;padding:6px 14px}
.mini:active{opacity:.6}

/* ---- tabellinjen */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
  background:var(--glass);border-top:.5px solid var(--sep);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;color:var(--fg3);font-size:10px;font-weight:500;position:relative;letter-spacing:.1px}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-selected=true]{color:var(--tint)}
.tabbar button:active{opacity:.6}
.tabbar .ant{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.tabbar .ant[hidden]{display:none}

/* ---- ark nedenfra */
.ark{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.42);animation:blek .25s ease both}
.ark[hidden]{display:none}
.ark-kort{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 28px - env(safe-area-inset-top));overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--ark-bg);border-radius:14px 14px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom));
  animation:opp .36s cubic-bezier(.2,.9,.25,1) both;--gruppe:var(--ark-gruppe);--bg:var(--ark-bg);overscroll-behavior:contain}
.grabber{width:36px;height:5px;border-radius:99px;background:var(--fg3);margin:6px auto 2px}
.ark-hode{position:sticky;top:0;z-index:2;background:var(--ark-bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 12px 6px;min-height:46px}
.ark-tittel{font-weight:600;font-size:17px;text-align:center;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ark-tittel small{display:block;font-size:12px;font-weight:400;color:var(--fg2)}
.ark-kropp{padding-bottom:6px}
.verdi-stor{text-align:center;font-size:64px;line-height:1;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:14px 0 6px}
.verdi-stor small{font-size:24px;font-weight:500;color:var(--fg2);margin-left:4px;letter-spacing:0}
.verdi-under{text-align:center;font-size:12px;color:var(--fg2);font-family:var(--mono);margin:0 24px 18px;overflow-wrap:anywhere}
.verdi-besk{text-align:center;font-size:14px;color:var(--fg2);margin:-10px 24px 18px}
@keyframes blek{from{opacity:0}to{opacity:1}}
@keyframes opp{from{transform:translateY(100%)}to{transform:none}}

/* ---- handlingsark: bekreftelser */
.as{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px calc(8px + env(safe-area-inset-bottom));animation:blek .2s ease both}
.as-kort,.as-avbryt{background:color-mix(in srgb,var(--ark-gruppe) 94%,transparent);border-radius:14px;overflow:hidden;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.as-kort{animation:opp .34s cubic-bezier(.2,.9,.25,1) both}
.as-topp{padding:18px 18px 10px;text-align:center}
.as-topp h3{margin:0;font-size:17px;font-weight:600}
.as-topp .under{font-size:12px;color:var(--fg2);font-family:var(--mono);margin-top:3px;overflow-wrap:anywhere}
.as-topp .tekst{font-size:14px;color:var(--fg2);margin-top:8px;white-space:pre-line;line-height:1.45}
.as-kort .diff{margin:6px 16px 10px}
.as-kort .chips{justify-content:center;margin:0 16px 10px}
.as-kort .advarsel{justify-content:center;margin:0 16px 14px}
.as-knapp{display:block;width:100%;border:0;border-top:.5px solid var(--sep);background:none;min-height:56px;font-size:20px;color:var(--tint)}
.as-knapp.prim{font-weight:600}
.as-knapp:active{background:var(--hev)}
.as-avbryt{margin-top:8px;animation:opp .34s .03s cubic-bezier(.2,.9,.25,1) both}
.as-avbryt .as-knapp{border:0;font-weight:600}
.diff{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--ark-bg)}
.diff b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
.diff .merke{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}
.diff .pil{color:var(--fg3);font-size:18px}
.diff .ny{text-align:right}.diff .ny b{color:var(--tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{font-size:12px;color:var(--fg2);background:var(--felt);border-radius:99px;padding:4px 11px}
.advarsel{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg2)}.advarsel span{color:var(--warn);font-size:15px}

/* ---- melding øverst, som en kapsel */
.hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-160%);z-index:80;width:max-content;max-width:calc(100% - 32px);
  background:#000;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;text-align:center;line-height:1.3;
  box-shadow:0 8px 28px rgba(0,0,0,.35);border:.5px solid rgba(255,255,255,.14);opacity:0;transition:transform .5s cubic-bezier(.2,1.25,.3,1),opacity .2s;pointer-events:none}
.hud.vis{transform:translate(-50%,0);opacity:1}
/* Mistet kontakten: blir stående til PC-en svarer igjen, under vanlige meldinger. Tegn og ord, ikke farge alene. */
.hud.borte{top:calc(env(safe-area-inset-top) + 58px);z-index:79;display:flex;gap:10px;align-items:center;border-color:rgba(255,184,0,.55);
  left:12px;right:12px;width:auto;max-width:520px;margin:0 auto;border-radius:18px;padding:12px 14px;transform:translateY(-160%)}
.hud.borte.vis{transform:none}
/* Trendkurven på punktet som er åpent, og steg-knappene for settpunkt */
.spor{margin:2px 16px 4px;color:var(--tint)}
.spor svg{display:block;width:100%;height:46px}
.spor div{display:flex;justify-content:space-between;font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums}
.steg-rad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 12px}
.steg-rad button{min-height:44px;border-radius:12px;border:0;background:var(--felt);color:var(--fg,inherit);font:inherit;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.steg-rad button:active{opacity:.6}
.hud.borte .borte-t{flex:1;min-width:0}
.hud.borte b{color:var(--warn);font-weight:700}
.hud.borte .borte-t{display:flex;flex-direction:column;gap:2px;text-align:left}
.hud.borte small{font-size:12px;opacity:.75}
.hud.borte button{flex:none;font:inherit;font-size:13px;font-weight:600;color:var(--accent,#0a84ff);background:none;border:0;padding:8px 4px 8px 8px;cursor:pointer}
.hud.borte.vis{pointer-events:auto}

/* ---- test, graf og resultat */
svg.graf{width:100%;height:130px;display:block;background:var(--gruppe);border-radius:12px}
.graf-boks{margin:0 16px 14px}
.test-rad{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;padding:11px 16px;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.test-rad.hode{font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;padding-top:12px;padding-bottom:6px}
.test-rad + .test-rad::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.dom{padding:14px 16px;font-size:16px;line-height:1.5}
.fase{margin:0 20px 12px;font-size:13px;color:var(--fg2);text-align:center}
.feil{color:var(--err);font-size:14px;margin:8px 20px}

/* ---- innlogging */
.logg{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 28px calc(32px + env(safe-area-inset-bottom));max-width:430px;margin:0 auto;text-align:center}
.logg svg.ansikt{width:84px;height:84px;margin:0 auto 18px}
.logg h1{font-size:34px;font-weight:700;margin:0 0 8px;letter-spacing:.4px}
.logg p{color:var(--fg2);font-size:15px;line-height:1.45;margin:0 0 26px}
.kode{width:100%;height:68px;border:0;border-radius:16px;background:var(--gruppe);text-align:center;font:600 32px var(--mono);letter-spacing:.35em;padding-left:.35em;color:var(--fg)}
.kode::placeholder{color:var(--fg3);letter-spacing:.3em}
.logg .feil{min-height:22px;margin:10px 0 14px;text-align:center}
.logg .knapp-stor{width:100%;margin:0}

.skjul-skrift{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================================================================ Glass, bevegelse og sveip */
:root{
  --glass-kort:rgba(44,44,48,.52);--glass-kant:rgba(255,255,255,.1);--glass-lys:rgba(255,255,255,.07);
  --glod1:rgba(90,162,255,.34);--glod2:rgba(150,90,255,.22);--glod3:rgba(48,209,88,.13);
  --glass-filter:blur(26px) saturate(175%);
}
@media (prefers-color-scheme:light){:root{
  --glass-kort:rgba(255,255,255,.62);--glass-kant:rgba(255,255,255,.7);--glass-lys:rgba(255,255,255,.9);
  --glod1:rgba(31,111,224,.2);--glod2:rgba(180,120,255,.15);--glod3:rgba(52,199,89,.12);
}}
html{background:var(--bg)}
body{background:transparent;touch-action:pan-y}
/* Glass trenger noe å være gjennomsiktig mot: et mykt, lysende bakteppe som blir stående mens du ruller. */
body::before,body::after{content:"";position:fixed;left:0;right:0;z-index:-1;pointer-events:none;overflow:hidden}
body::before{top:0;height:58%;background:radial-gradient(70% 52% at 18% 26%,var(--glod1),transparent 74%),radial-gradient(60% 46% at 90% 36%,var(--glod2),transparent 74%)}
body::after{bottom:0;height:46%;background:radial-gradient(70% 52% at 56% 84%,var(--glod3),transparent 74%)}

.liste,.widget{background:var(--glass-kort);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);border:.5px solid var(--glass-kant);box-shadow:inset 0 1px 0 var(--glass-lys)}
.sok input,.seg{border:.5px solid var(--glass-kant)}
.widget{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* ---- flytende tabellinje med en glidende glasspille */
body{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.tabbar{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:30px;
  border:.5px solid var(--glass-kant);box-shadow:0 14px 44px rgba(0,0,0,.34),inset 0 1px 0 var(--glass-lys)}
.tabbar .piller{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 3);border-radius:24px;background:color-mix(in srgb,var(--tint) 20%,transparent);
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--tint) 35%,transparent);transition:transform .42s cubic-bezier(.3,1.35,.4,1)}
.tabbar button{position:relative;z-index:1;padding:7px 0 5px}

/* ---- segmentert kontroll med en tommel som glir */
.seg{position:relative;isolation:isolate}
.seg button{position:relative;z-index:1;background:none!important;box-shadow:none!important}
.seg-tommel{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--seg-valgt);box-shadow:var(--skygge);z-index:0;
  transition:transform .34s cubic-bezier(.3,1.25,.4,1),width .34s cubic-bezier(.3,1.25,.4,1)}

/* ---- ark: glass, og et grep som kan dras */
.ark-kort{background:color-mix(in srgb,var(--ark-bg) 74%,transparent);-webkit-backdrop-filter:blur(44px) saturate(185%);backdrop-filter:blur(44px) saturate(185%);
  border-top:.5px solid var(--glass-kant);box-shadow:0 -10px 50px rgba(0,0,0,.3)}
.ark-hode{background:color-mix(in srgb,var(--ark-bg) 55%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);touch-action:none}
.grabber{touch-action:none;width:64px;height:21px;margin:0 auto;border-radius:0;background:none;position:relative}
.grabber::after{content:"";position:absolute;left:14px;right:14px;top:8px;height:5px;border-radius:99px;background:var(--fg3)}
.ark-kort .liste{background:color-mix(in srgb,var(--ark-gruppe) 62%,transparent)}
.as-kort,.as-avbryt{border:.5px solid var(--glass-kant)}

/* ---- sveip på rader */
.sveip{position:relative;overflow:hidden}
.sveip + .sveip::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep);z-index:2}
.sveip-inn{position:relative;z-index:1;touch-action:pan-y;transition:transform .34s cubic-bezier(.2,.9,.25,1);will-change:transform}
.sveip-inn.drar{transition:none}
.sveip-inn .celle{background:none}
.sveip-hand{position:absolute;top:0;bottom:0;right:0;display:flex;opacity:0;transition:opacity .15s;z-index:0}
.sveip.aapen .sveip-hand,.sveip.drar .sveip-hand{opacity:1}
.sveip-hand button{border:0;min-width:92px;padding:0 18px;color:#fff;font-size:16px;font-weight:600}
.sveip-hand .slipp{background:#ff9f0a}
.sveip-hand .fest{background:var(--tint)}
.sveip-hand .losne{background:#8e8e93}
.sveip-hand button:active{filter:brightness(.88)}

/* ---- trekk for å oppdatere */
.ptr{position:fixed;top:calc(env(safe-area-inset-top) + 46px);left:50%;width:36px;height:36px;margin-left:-18px;z-index:15;opacity:0;pointer-events:none;
  display:grid;place-items:center;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid var(--glass-kant)}
.ptr svg{width:20px;height:20px;color:var(--tint)}
.ptr.snurr svg{animation:snurr .8s linear infinite}
@keyframes snurr{to{transform:rotate(360deg)}}

/* ---- meny ved langt trykk */
.ctx{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:blek .2s ease both}
.ctx.ctx-lukker{animation:blekut .15s ease both}
.ctx-klone{position:fixed;margin:0;z-index:71;animation:loft .26s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.ctx-meny{position:fixed;z-index:72;min-width:230px;border-radius:16px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(185%);backdrop-filter:blur(40px) saturate(185%);
  border:.5px solid var(--glass-kant);box-shadow:0 18px 50px rgba(0,0,0,.4);animation:pop .26s cubic-bezier(.2,1.3,.4,1) both}
.ctx-meny button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:13px 16px;border:0;background:none;font-size:17px;text-align:left;color:var(--fg)}
.ctx-meny button + button{border-top:.5px solid var(--sep)}
.ctx-meny button:active{background:var(--hev)}
.ctx-meny svg{width:18px;height:18px;flex:none;color:var(--fg2)}
@keyframes loft{from{transform:scale(1)}to{transform:scale(1.045)}}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes blekut{from{opacity:1}to{opacity:0}}

/* ---- innlasting og inngang */
.skjelett{display:block;height:54px;background:linear-gradient(100deg,transparent 20%,var(--felt) 45%,transparent 70%);background-size:220% 100%;animation:skim 1.25s ease-in-out infinite}
.skjelett + .skjelett{border-top:.5px solid var(--sep)}
@keyframes skim{from{background-position:130% 0}to{background-position:-90% 0}}
.liste.ny > *,.widgets.ny > *{animation:rad-inn .46s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i,0) * 32ms)}
@keyframes rad-inn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="rot"></div>
<script src="/m/lev-logo.js"></script>
<script src="/m/lev.js"></script>
<script>
'use strict';
const NO = /^(nb|no|nn)/i.test(navigator.language || 'nb');
const T = (n, e) => NO ? n : e;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H = {'Content-Type': 'application/json', 'X-Nabe': '1', 'X-Sprak': NO ? 'nb' : 'en'};
const LS = {
  les(k, d) { try { return JSON.parse(localStorage.getItem('nm_' + k)) ?? d; } catch { return d; } },
  skriv(k, v) { try { localStorage.setItem('nm_' + k, JSON.stringify(v)); } catch {} },
};

const FANER = ['verdier', 'enheter', 'mine'];
const S = {skriv: false, maks: 10, readonly: false, tab: 'verdier', pins: LS.les('pins', []), vals: {}, tid: 0,
  enheter: [], sok: '', enhet: null, punkter: [], pFilter: '', typer: 'alle', apent: null, mine: [], mineSig: '', test: null, retning: null};

/* ------------------------------------------------------------------ små deler */
const SVG = (d, vb = '0 0 24 24') => `<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>';
const SOK_IKON = SVG('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>');
const IKON_TAB = {
  verdier: SVG('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>'),
  enheter: SVG('<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/>'),
  mine: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
};
const IKON_MENY = {
  aapne: SVG('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
  losne: SVG('<path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3v2H7v-2l3-3z"/><path d="m3 3 18 18"/>'),
  laas: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>'),
};
const IKON_OPPDATER = SVG('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>');
const ANSIKT = '<svg class="ansikt" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="20" width="44" height="34" rx="11" fill="var(--fg)"/><circle cx="25" cy="37" r="4" fill="var(--bg)"/><circle cx="39" cy="37" r="4" fill="var(--bg)"/><path d="M26 46h12" stroke="var(--bg)" stroke-width="3" stroke-linecap="round"/><path d="M32 20v-8" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="9" r="3.5" fill="var(--tint)"/></svg>';
const TYPE_KORT = {'analog-input': 'AI', 'analog-output': 'AO', 'analog-value': 'AV', 'binary-input': 'BI', 'binary-output': 'BO', 'binary-value': 'BV',
  'multi-state-input': 'MI', 'multi-state-output': 'MO', 'multi-state-value': 'MV'};
const typeKort = t => TYPE_KORT[t] || String(t || '?').slice(0, 2).toUpperCase();
const erUt = t => /output|value/.test(String(t || ''));

function tom(tittel, tekst, knapp) {
  return `<div class="tom">${ANSIKT}<h2>${esc(tittel)}</h2><p>${tekst}</p>${knapp ? `<button class="mini" data-gaa="${esc(knapp[0])}">${esc(knapp[1])}</button>` : ''}</div>`;
}

// En rad du kan sveipe: handlingene ligger bak innholdet og kommer til syne når du drar.
const sveipRad = (attrs, inn, handlinger) => `<div class="sveip" ${attrs}><div class="sveip-hand">${handlinger.map(([id, tekst, kl]) => `<button class="${kl}" data-h="${id}">${esc(tekst)}</button>`).join('')}</div><div class="sveip-inn">${inn}</div></div>`;
const stagger = (el) => el.querySelectorAll(':scope > *').forEach((x, i) => x.style.setProperty('--i', Math.min(i, 14)));

let hudT;
function toast(t) {
  let e = $('hud');
  if (!e) { e = document.createElement('div'); e.id = 'hud'; e.className = 'hud'; e.setAttribute('role', 'status'); e.setAttribute('aria-live', 'polite'); document.body.appendChild(e); }
  e.textContent = t;
  requestAnimationFrame(() => e.classList.add('vis'));
  clearTimeout(hudT);
  hudT = setTimeout(() => e.classList.remove('vis'), 3300);
}
// En liten tikk i fingeren der telefonen kan (iOS lar ikke nettsider gjøre det).
document.addEventListener('click', e => { if (e.target.closest('button') && navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) { try { navigator.vibrate(6); } catch {} } }, true);
window.addEventListener('scroll', () => document.body.classList.toggle('skrullet', window.scrollY > 36), {passive: true});

// Haptikk der telefonen kan (iOS lar ikke nettsider gjøre det). Ett mønster for hver slags utfall.
const hapt = m => { try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(m); } catch {} };

// Kontakten med PC-en. To bom på rad og siden sier fra; første svar etterpå og den sier fra igjen. Pollingen
// gjør at den prøver av seg selv, og alt som er skrevet slippes av PC-en uansett, så ingenting henger igjen.
let bomTeller = 0;
/* Hva som oftest er galt når PC-en ikke svarer, avhengig av veien telefonen går. */
function kontaktTips(vert) {
  if (/\.ts\.net$/.test(vert) || /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(vert)) return T('Sjekk at Tailscale er på på telefonen.', 'Check that Tailscale is on on the phone.');
  if (/^(172\.20\.10\.|192\.168\.4[23]\.)/.test(vert)) return T('Sjekk at «Del internett» er på, og at PC-en er koblet til.', 'Check that the hotspot is on and the PC is connected.');
  if (/^192\.168\.137\./.test(vert)) return T('Sjekk at telefonen er på PC-ens hotspot.', 'Check that the phone is on the PC hotspot.');
  return T('Sjekk at telefonen er på samme nett som PC-en, og at PC-en ikke sover.', 'Check that the phone is on the same network as the PC, and that the PC is awake.');
}
let sistSvar = Date.now(), borteTikk = 0;
function borteAlder() {
  const e = document.querySelector('#borte small');
  if (!e) return;
  const s = Math.max(0, Math.round((Date.now() - sistSvar) / 1000));
  e.textContent = (s < 120 ? T(`Sist svar for ${s} s siden. `, `Last answer ${s} s ago. `) : T(`Sist svar for ${Math.round(s / 60)} min siden. `, `Last answer ${Math.round(s / 60)} min ago. `)) + kontaktTips(location.hostname);
}
function kobling(ok) {
  if (ok) {
    bomTeller = 0;
    sistSvar = Date.now();
    clearInterval(borteTikk);
    if (S.borte) {
      S.borte = false;
      const e = $('borte');
      if (e) e.classList.remove('vis');
      toast(T('Kontakten er tilbake. Alt er som du lot det.', 'Contact is back. Everything is as you left it.'));
      hapt(16);
      if (S.tab === 'mine') lastMine();
    }
    return;
  }
  if (++bomTeller < 2 || S.borte) return;
  S.borte = true;
  let e = $('borte');
  if (!e) { e = document.createElement('div'); e.id = 'borte'; e.className = 'hud borte'; e.setAttribute('role', 'status'); document.body.appendChild(e); }
  e.innerHTML = `<b aria-hidden="true">!</b><span class="borte-t"><span>${T('Mistet kontakten med PC-en. Prøver igjen. Det du har satt slippes av seg selv.', 'Lost contact with the PC. Retrying. What you set is released by itself.')}</span><small></small></span><button type="button">${T('Prøv nå', 'Retry')}</button>`;
  e.querySelector('button').onclick = () => proevNaa();
  borteAlder();
  clearInterval(borteTikk);
  borteTikk = setInterval(borteAlder, 1000);
  requestAnimationFrame(() => e.classList.add('vis'));
  hapt([40, 50, 40]);
  if (S.test && !$('ark').hidden) tegTest();
}
window.addEventListener('offline', () => { bomTeller = 5; kobling(false); });

// Skjermen holdes våken så lenge noe kjører eller står overstyrt, og slippes ellers, så batteriet ikke betaler for det.
let vakt = null;
async function oppdaterVaken() {
  const trengs = !!((S.test && S.test.kjorer) || (S.mine && S.mine.length));
  try {
    if (trengs && !vakt && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      vakt = await navigator.wakeLock.request('screen');
      vakt.addEventListener('release', () => { vakt = null; });
    } else if (!trengs && vakt) { const v = vakt; vakt = null; await v.release(); }
  } catch { vakt = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') oppdaterVaken(); });
setInterval(oppdaterVaken, 5000);

/* Mobilnettet kan bli hengende uten å si fra. Hver forespørsel har derfor en frist; en lesing prøves igjen av seg selv,
   en skriving aldri, for den kan ha kommet fram selv om svaret ikke gjorde det. */
async function hentMedFrist(sti, opt, frist) {
  const stopp = new AbortController();
  const t = setTimeout(() => stopp.abort(), frist);
  try { return await fetch(sti, Object.assign({signal: stopp.signal}, opt)); } finally { clearTimeout(t); }
}
const SKRIVER = /^\/api\/(write|test\/svar)$/;
async function api(sti, body) {
  const opt = body === undefined ? {headers: {'X-Sprak': H['X-Sprak']}} : {method: 'POST', headers: H, body: JSON.stringify(body)};
  const skriving = body !== undefined && SKRIVER.test(sti);
  let r;
  try { r = await hentMedFrist(sti, opt, skriving ? 30000 : 15000); }
  catch (e) {
    kobling(false);
    if (skriving) return {status: 'usikkert', error: T('Usikkert om det kom fram. Sjekk verdien før du prøver igjen.', 'Not sure it got through. Check the value before you try again.')};
    throw e;
  }
  kobling(true);
  if (r.status === 401) { visLogin(); throw new Error('401'); }
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok && !j.error) j.error = 'Feil ' + r.status;
  return j;
}

/* ------------------------------------------------------------- bevegelse */
function animer(retning) {
  const el = $('innhold');
  if (!el || !retning || !el.animate) return;
  const fra = retning === 'fram' ? 38 : -28;
  el.animate([{transform: `translateX(${fra}px)`, opacity: 0}, {transform: 'none', opacity: 1}], {duration: 360, easing: 'cubic-bezier(.2,.9,.25,1)'});
}

// Den glidende tommelen i en segmentert kontroll.
function segTommel(seg, glid = true) {
  if (!seg) return;
  let t = seg.querySelector('.seg-tommel');
  if (!t) { t = document.createElement('span'); t.className = 'seg-tommel'; seg.prepend(t); }
  const b = seg.querySelector('button[aria-pressed=true]');
  if (!b) { t.style.opacity = '0'; return; }
  t.style.opacity = '1';
  if (!glid) t.style.transition = 'none';
  t.style.width = b.offsetWidth + 'px';
  t.style.transform = `translateX(${b.offsetLeft - 2}px)`;
  if (!glid) requestAnimationFrame(() => { t.style.transition = ''; });
}

function oppdaterPiller() {
  const p = $('piller');
  if (p) p.style.transform = `translateX(${Math.max(0, FANER.indexOf(S.tab)) * 100}%)`;
}

function bytteTab(ny, retning) {
  if (ny === S.tab) return;
  S.retning = retning || (FANER.indexOf(ny) > FANER.indexOf(S.tab) ? 'fram' : 'tilbake');
  S.tab = ny;
  window.scrollTo(0, 0);
  teg();
}

function tilbakeTilEnheter() {
  S.enhet = null;
  window.scrollTo(0, 0);
  tegEnheter();
  animer('tilbake');
}

async function oppdaterSide() {
  try {
    if (S.tab === 'verdier') await pollVerdier();
    else if (S.tab === 'enheter' && !S.enhet) { await lastEnheter(); tegEnhetListe(false); }
    else if (S.tab === 'mine') { await lastMine(); tegMine(); }
  } catch {}
}

/* ------------------------------------------------------------- innlogging */
function visLogin(feil) {
  S.inne = false;
  clearTimeout(S.lop);
  document.body.classList.remove('skrullet');
  $('rot').innerHTML = `<div class="logg">${ANSIKT}<h1>NABE</h1>
    <p>${T('Skriv koden som står i NABE på PC-en, under «Mobil». Eller skann QR-koden, så slipper du.', 'Type the code shown in NABE on the PC, under “Mobile”. Or scan the QR code and skip this.')}</p>
    <input id="kode" class="kode" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" aria-label="${T('Kode', 'Code')}">
    <div class="feil" id="lFeil" role="alert">${esc(feil || '')}</div>
    <button class="knapp-stor" id="lKnapp">${T('Koble til', 'Connect')}</button></div>`;
  let sender = false;
  const gaa = async () => {
    if (sender) return;
    sender = true;
    try {
      const r = await hentMedFrist('/m/logginn', {method: 'POST', headers: H, body: JSON.stringify({kode: $('kode').value})}, 15000);
      const j = await r.json().catch(() => ({}));
      if (j.ok) start(); else { $('lFeil').textContent = j.feil || T('Feil kode.', 'Wrong code.'); $('kode').select(); }
    } catch { $('lFeil').textContent = T('Får ikke kontakt med PC-en. ', 'Cannot reach the PC. ') + kontaktTips(location.hostname); }
    finally { sender = false; }
  };
  $('lKnapp').onclick = gaa;
  $('kode').addEventListener('keydown', e => { if (e.key === 'Enter') gaa(); });
  // Seks siffer er hele koden: da er det ingenting mer å vente på.
  $('kode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) gaa(); });
  $('kode').focus();
}

/* ------------------------------------------------------------------ rammen */
const TITLER = () => ({verdier: T('Verdier', 'Values'), enheter: T('Enheter', 'Devices'), mine: T('Overstyrt', 'Overridden')});

function ramme() {
  $('rot').innerHTML = `<header class="nav" id="navbar">
      <div class="nav-venstre"><button class="nav-tilbake" id="navTilbake" hidden><svg viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg><span id="navTilbakeTekst"></span></button></div>
      <div class="nav-tittel" id="navTittel"></div>

    </nav><div class="ark" id="ark" hidden><div class="ark-kort" id="arkInn"></div></div>`;
  $('nav').onclick = e => { const b = e.target.closest('button'); if (b) bytteTab(b.dataset.t); };

function navTilstand(tittel, tilbake) {

function pille() {

function teg() {
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === S.tab)));
