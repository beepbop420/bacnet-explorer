/* ------------------------------------------------------------------ verdier */
function fmt(v) {
  if (v === 'active') return T('På', 'On');
  if (v === 'inactive') return T('Av', 'Off');
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1));
  if (v == null || v === '') return '–';
  if (typeof v === 'object') return '?';
  return String(v);
}
const sym = p => ({'degrees-celsius': '°C', 'percent': '%', 'pascals': 'Pa', 'kilopascals': 'kPa', 'bars': 'bar', 'cubic-meters-per-hour': 'm³/h',
  'liters-per-second': 'l/s', 'kilowatts': 'kW', 'kilowatt-hours': 'kWh', 'volts': 'V', 'amperes': 'A', 'hertz': 'Hz', 'revolutions-per-minute': 'rpm'}[p.units] || p.unit_symbol || '');
const pinNokkel = p => p.address + '|' + p.objid;
const erFestet = p => S.pins.some(x => pinNokkel(x) === pinNokkel(p));

function festPunkt(p) {
  const i = S.pins.findIndex(x => pinNokkel(x) === pinNokkel(p));
  if (i >= 0) S.pins.splice(i, 1);
  else S.pins.push({address: p.address, enhet: p.enhet, instans: p.instans, objid: p.objid, type: p.type, skrivbar: p.skrivbar, name: p.name, sym: p.sym, beskrivelse: p.beskrivelse});
  LS.skriv('pins', S.pins);
  return i < 0;
}

function widget(p, i) {
  const v = (S.vals[p.address] || {})[p.objid];
  return `<button class="widget" data-k="${i}" style="--i:${Math.min(i, 14)}"><span class="w-navn">${esc(p.name || p.objid)}</span>
    <span class="w-verdi">${esc(fmt(v))}<small>${esc(p.sym || '')}</small></span><span class="w-enhet">${esc(p.enhet || p.address)}</span></button>`;
}

function tegVerdier() {
  const m = $('innhold');
  navTilstand(TITLER().verdier, null);
  if (!S.pins.length) {
    m.innerHTML = `<h1 class="stor-tittel">${TITLER().verdier}</h1>` + tom(T('Ingen festede punkter', 'No pinned points'),
      T('Åpne et punkt under Enheter og trykk Fest, eller sveip et punkt til venstre. Ellers blir dette en veldig rolig skjerm.', 'Open a point under Devices and press Pin, or swipe a point to the left. Otherwise this is a very quiet screen.'), ['enheter', T('Gå til Enheter', 'Go to Devices')]);
    m.onclick = null;
    return;
  }
  m.innerHTML = `<h1 class="stor-tittel">${TITLER().verdier}</h1><div class="widgets ny" id="widgets">${S.pins.map(widget).join('')}</div>
    <div class="liste-fot" style="margin-top:-8px;text-align:center">${T('Hold inne på en widget for flere valg', 'Press and hold a widget for more options')}</div>`;
  m.onclick = e => { const b = e.target.closest('[data-k]'); if (b) apneArk(S.pins[+b.dataset.k]); };
}

// Verdiene byttes på stedet. Tegnes widgetene på nytt hvert andre sekund, kan et trykk gå tapt midt i bevegelsen.
function oppdaterVerdier() {
  const g = $('widgets');
  if (!g) return;
  const gammel = S.tid && Date.now() - S.tid > 8000;
  g.querySelectorAll('.widget').forEach(w => {
    const p = S.pins[+w.dataset.k];
    if (!p) return;
    const v = (S.vals[p.address] || {})[p.objid];
    const el = w.querySelector('.w-verdi');
    const ny = esc(fmt(v)) + `<small>${esc(p.sym || '')}</small>`;
    if (el.innerHTML !== ny) el.innerHTML = ny;
    w.classList.toggle('gammel', !!gammel);
  });
}

/* Over et tregt nett skal ikke forespørslene hope seg opp: én av gangen, og pausen mellom dem følger svartiden. */
let pollGaar = false, pollTid = 0;
async function pollVerdier() {
  if (pollGaar) return;
  pollGaar = true;
  const t0 = Date.now();
  try { await pollEn(); } finally { pollGaar = false; pollTid = Date.now() - t0; }
}
const pollPause = (svartid) => Math.min(8000, Math.max(2000, Math.round(svartid * 1.5)));
function pollNeste() {
  clearTimeout(S.lop);
  if (!S.inne) return;
  S.lop = setTimeout(async () => {
    try {
      // Skjermen av: ingen trafikk. Borte: spør etter livstegn selv om det ikke er noe å lese.
      if (!document.hidden) { if (S.borte) await status(); await pollVerdier(); }
    } catch {}
    pollNeste();
  }, S.borte ? 3000 : pollPause(pollTid));
}
async function proevNaa() {
  if (!S.inne) return;
  bomTeller = 0;
  try { await status(); await pollVerdier(); await lastMine(); } catch {}
}
// Telefonen tas opp av lomma, eller dekningen er tilbake: spør med en gang
document.addEventListener('visibilitychange', () => { if (!document.hidden) proevNaa(); });
window.addEventListener('online', () => proevNaa());

async function pollEn() {
  const mal = {};
  S.pins.forEach(p => { (mal[p.address] = mal[p.address] || []).push(p.objid); });
  if (S.apent) { (mal[S.apent.address] = mal[S.apent.address] || []).push(S.apent.objid); }
  if (S.test && S.test.maaling) { const t = S.test; (mal[t.maaling_address] = mal[t.maaling_address] || []).push(t.maaling); }
  const adr = Object.keys(mal);
  if (!adr.length) return;
  try {
    const r = await api('/api/poll', {targets: Object.fromEntries(adr.map(a => [a, [...new Set(mal[a])]])), cov: false});
    if (r.status === 'done') {
      for (const a of Object.keys(r.values || {})) S.vals[a] = Object.assign(S.vals[a] || {}, r.values[a]);
      S.tid = Date.now();
      if (S.tab === 'verdier') oppdaterVerdier();
      if (S.apent) oppdaterArkVerdi();
    }
  } catch {}
}

/* ------------------------------------------------------------------ enheter */
async function lastEnheter() {
  const r = await api('/api/sites');
  const ut = [];
  const sett = new Set();
  for (const [n, s] of Object.entries(r.sites || {})) {
    for (const d of (s.enheter || [])) {
      if (!d.address || sett.has(d.address + d.device_instance)) continue;
      sett.add(d.address + d.device_instance);
      // Samme navn som appen: anleggets eget navn, ellers navnene på de to første regulatorene, ellers området
      const navnListe = (s.enheter || []).map(x => x.object_name).filter(Boolean);
      const anleggNavn = s.navn || (navnListe.length ? navnListe.slice(0, 2).join(', ') + (navnListe.length > 2 ? ' +' + (navnListe.length - 2) : '') : '') || n;
      ut.push({address: d.address, instans: d.device_instance, navn: d.object_name || ('Device ' + d.device_instance), vendor: (typeof vendorOf === 'function' && d.vendor) ? vendorOf(d.vendor).label : (d.vendor || ''), anlegg: anleggNavn, systemer: d.systemer || []});
    }
  }
  ut.sort((a, b) => a.address.localeCompare(b.address, undefined, {numeric: true}));
  // Samme navn på flere enheter (Beckhoff_0 og Beckhoff_0): siste del av adressen skiller dem, som i appen
  const antallNavn = new Map();
  for (const d of ut) antallNavn.set(d.navn, (antallNavn.get(d.navn) || 0) + 1);
  for (const d of ut) {
    const m = /(\d+)(?::\d+)?$/.exec(String(d.address));
    d.suffiks = antallNavn.get(d.navn) > 1 && m ? '.' + m[1] : '';
  }
  S.enheter = ut;
}

function tegEnheter() {
  const m = $('innhold');
  if (S.enhet) { tegPunkter(); return; }
  navTilstand(TITLER().enheter, null);
  m.innerHTML = `<h1 class="stor-tittel">${TITLER().enheter}</h1>
    <div class="sok">${SOK_IKON}<input type="search" id="sok" placeholder="${T('Søk', 'Search')}" value="${esc(S.sok)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${T('Søk enhet, IP eller anlegg', 'Search device, IP or site')}"></div>
    <div id="enhetListe"></div>`;
  $('sok').oninput = e => { S.sok = e.target.value; tegEnhetListe(false); };
  m.onclick = null;
  tegEnhetListe(true);
}

/* Seksjonene kan lukkes og åpnes. Hva som er lukket huskes mens siden lever; et søk åpner alt. */
S.lukket = S.lukket || new Set();
const seksjonHode = (nokkel, tittel, n, apen) => `<button type="button" class="seksjon gr" data-gr="${esc(nokkel)}" aria-expanded="${apen}"><i></i><span>${tittel}</span><small>${n}</small></button>`;

function tegEnhetListe(ny) {
  const q = S.sok.toLowerCase();
  const l = S.enheter.filter(d => !q || (d.navn + d.address + d.vendor + d.anlegg).toLowerCase().includes(q));
  const el = $('enhetListe');
  if (!el) return;
  const celle = d => `<button class="celle med-ikon" data-i="${S.enheter.indexOf(d)}"><span class="ik enhet">${SVG('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>')}</span>
      <span class="ct"><span class="ct1">${esc(d.navn)}${d.suffiks ? ` <small class="suff">${esc(d.suffiks)}</small>` : ''}</span><span class="ct2 mono">${esc(d.address)} · ${T('enhet', 'device')} ${esc(d.instans)}${d.vendor ? ' · ' + (typeof levLogo === 'function' ? levLogo(d.vendor) : esc(d.vendor)) : ''}</span>${systemTagger(d.systemer)}</span>${CHEV}</button>`;
  // Bygg først: en igangkjøring er ett bygg om gangen. Bare ett bygg gir ingen overskrifter.
  const bygg = new Map();
  for (const d of l) { const k = d.anlegg || '—'; if (!bygg.has(k)) bygg.set(k, []); bygg.get(k).push(d); }
  const medBygg = bygg.size > 1;
  // Snarveiene: det PC-en har åpent akkurat nå, og det du selv åpnet sist
  const snar = [];
  const cellerFor = (liste) => `<div class="liste">${liste.map(d => `<button class="celle med-ikon" data-snar="${esc(d.address)}"><span class="ik enhet">${SVG('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>')}</span>
      <span class="ct"><span class="ct1">${esc(d.navn)}${d.suffiks ? ` <small class="suff">${esc(d.suffiks)}</small>` : ''}</span><span class="ct2 mono">${esc(d.address)}</span></span>${CHEV}</button>`).join('')}</div>`;
  if (!q) {
    const paaPc = S.aktiv && finnEnhet(S.aktiv);
    if (paaPc) snar.push(`<div class="seksjon">${T('Åpent på PC-en', 'Open on the PC')}</div>${cellerFor([paaPc])}`);
    const sist = (LS.les('sist') || []).map(finnEnhet).filter(d => d && (!paaPc || d.address !== paaPc.address)).slice(0, 3);
    if (sist.length && S.enheter.length > 4) snar.push(`<div class="seksjon">${T('Sist brukt', 'Recently used')}</div>${cellerFor(sist)}`);
    if (snar.length && !medBygg) snar.push(`<div class="seksjon">${T('Alle', 'All')}</div>`);
  }
  el.innerHTML = snar.join('') + (l.length ? (medBygg
      ? [...bygg].map(([k, ds]) => { const apen = !!q || !S.lukket.has('b:' + k);
          return seksjonHode('b:' + k, esc(k), ds.length, apen) + (apen ? `<div class="liste${ny ? ' ny' : ''}">${ds.map(celle).join('')}</div>` : ''); }).join('')
      : `<div class="liste${ny ? ' ny' : ''}">${l.map(celle).join('')}</div>`)
    : snar.length ? '' : tom(q ? T('Ingen treff', 'No match') : T('Ingen enheter ennå', 'No devices yet'),
      q ? T('Prøv et annet ord, eller en del av IP-en.', 'Try another word, or part of the IP.') : T('La PC-en skanne et område først. Jeg er bare telefonen.', 'Let the PC scan a range first. I am only the phone.')));
  if (ny && l.length) el.querySelectorAll('.liste').forEach(x => stagger(x));
  el.onclick = e => {
    const g = e.target.closest('[data-gr]');
    if (g) { const k = g.dataset.gr; S.lukket.has(k) ? S.lukket.delete(k) : S.lukket.add(k); tegEnhetListe(false); return; }
    const sn = e.target.closest('[data-snar]');
    if (sn) { const d = finnEnhet({address: sn.dataset.snar}) || (S.aktiv && S.aktiv.address === sn.dataset.snar ? finnEnhet(S.aktiv) : null); if (d) apneEnhet(d); return; }
    const b = e.target.closest('[data-i]'); if (b) apneEnhet(S.enheter[+b.dataset.i]);
  };
}

/* En snarvei kan peke på en enhet som ikke ligger i anleggsminnet ennå (PC-en har den bare åpen): da holder det den sier. */
function finnEnhet(s) {
  if (!s || !s.address) return null;
  const d = S.enheter.find(x => x.address === s.address && (s.instans == null || x.instans == null || x.instans === s.instans)) || S.enheter.find(x => x.address === s.address);
  return d || (s.navn !== undefined ? {address: s.address, instans: s.instans, navn: s.navn || s.address, vendor: '', anlegg: '', systemer: [], suffiks: ''} : null);
}

async function apneEnhet(d) {
  S.enhet = d; S.punkter = []; S.pFilter = ''; S.typer = 'alle';
  LS.skriv('sist', [{address: d.address, instans: d.instans, navn: d.navn}, ...(LS.les('sist') || []).filter(x => x.address !== d.address)].slice(0, 6));
  window.scrollTo(0, 0);
  const tilbake = (melding) => { if (melding) toast(melding); if (S.enhet === d) { S.enhet = null; if (S.tab === 'enheter') { tegEnheter(); animer('tilbake'); } } };
  navTilstand(d.navn, TITLER().enheter);
  $('innhold').innerHTML = `<h1 class="stor-tittel">${esc(d.navn)}</h1><div class="stor-under">${esc(d.address)}</div>
    <div class="liste" aria-busy="true">${'<span class="skjelett"></span>'.repeat(6)}</div>
    <div style="text-align:center"><div id="lest" class="liste-fot" style="margin:0 0 12px">${T('Leser punkter…', 'Reading points…')}</div><button class="mini" id="lestAvbryt">${T('Avbryt', 'Cancel')}</button></div>`;
  animer('fram');
  let jobb = null, avbrutt = false;
  $('lestAvbryt').onclick = async () => { avbrutt = true; if (jobb) api('/api/job/' + jobb + '/cancel', {}).catch(() => {}); tilbake(); };
  const r = await api('/api/device/points', {address: d.address, device_instance: d.instans});
  if (r.status !== 'started') return tilbake(r.error || T('Klarte ikke lese punkter', 'Could not read points'));
  jobb = r.job_id;
  const slutt = Date.now() + 75000;
  while (!avbrutt && S.enhet === d) {
    if (Date.now() > slutt) {
      api('/api/job/' + jobb + '/cancel', {}).catch(() => {});
      return tilbake(T('Enheten svarer ikke. Sjekk at PC-en når anlegget, telefonen er bare tilskuer.', 'The device is not answering. Check that the PC reaches the plant, the phone is just a spectator.'));
    }
    await new Promise(res => setTimeout(res, 700));
    if (avbrutt || S.enhet !== d) return;
    const j = await api('/api/job/' + jobb);
    if (j.status === 'done') {
      S.punkter = ((j.result || {}).points || []);
      if (!S.punkter.length) return tilbake(T('Fant ingen punkter i enheten.', 'No points found in the device.'));
      break;
    }
    if (j.status === 'error' || j.status === 'cancelled') return tilbake(j.error || T('Avbrutt', 'Cancelled'));
    const el = $('lest');
    if (el && j.progress != null && j.progress.done != null) el.textContent = T('Leser punkter… ', 'Reading points… ') + j.progress.done + '/' + j.progress.total;
  }
  if (S.enhet === d && S.tab === 'enheter') tegPunkter();
}

const TYPEGRUPPE = {pad: ['analog-output', 'analog-value', 'binary-output', 'binary-value', 'multi-state-output', 'multi-state-value'],
  mal: ['analog-input', 'binary-input', 'multi-state-input']};

function tegPunkter() {
  const m = $('innhold');
  const d = S.enhet;
  navTilstand(d.navn, TITLER().enheter);
  const detaljSys = [...new Set(S.punkter.map(sysNr).filter(Boolean).map(x => x.slice(0, 3)))].sort();
  m.innerHTML = `<h1 class="stor-tittel">${esc(d.navn)}${d.suffiks ? ` <small class="suff">${esc(d.suffiks)}</small>` : ''}</h1><div class="stor-under">${esc(d.address)} · ${T('enhet', 'device')} ${esc(d.instans)}${d.vendor ? ' · ' + (typeof levLogo === 'function' ? levLogo(d.vendor) : esc(d.vendor)) : ''}</div>
    ${systemTagger(detaljSys.length ? detaljSys : d.systemer)}
    <div class="seg" id="seg">${[['alle', T('Alle', 'All')], ['pad', T('Pådrag', 'Outputs')], ['mal', T('Målinger', 'Inputs')]].map(([k, t]) => `<button data-ty="${k}" aria-pressed="${S.typer === k}">${t}</button>`).join('')}</div>
    <div class="sok">${SOK_IKON}<input type="search" id="pq" placeholder="${T('Søk punkt', 'Search point')}" value="${esc(S.pFilter)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${T('Søk punkt', 'Search point')}"></div>
    <div class="seg grvelger" id="grSeg" aria-label="${T('Grupper etter', 'Group by')}">${[['system', T('System', 'System')], ['type', T('Type', 'Type')], ['ingen', T('Ingen', 'None')]].map(([k, t]) => `<button data-gr2="${k}" aria-pressed="${(S.gruppe || (new Set(S.punkter.map(sysNr).filter(Boolean)).size > 1 ? 'system' : 'ingen')) === k}">${t}</button>`).join('')}</div>
    <div id="punktListe"></div>`;
  $('grSeg').onclick = e => { const b = e.target.closest('[data-gr2]'); if (!b) return; S.gruppe = b.dataset.gr2; document.querySelectorAll('#grSeg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.gr2 === S.gruppe))); segTommel($('grSeg')); tegPunktListe(false); };
  $('pq').oninput = e => { S.pFilter = e.target.value; tegPunktListe(false); };
  $('seg').onclick = e => { const ty = e.target.closest('[data-ty]'); if (!ty) return; S.typer = ty.dataset.ty; document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ty === S.typer))); segTommel($('seg')); tegPunktListe(false); };
  m.onclick = null;
  segTommel($('seg'), false); segTommel($('grSeg'), false);
  requestAnimationFrame(() => { segTommel($('seg'), false); segTommel($('grSeg'), false); });
  tegPunktListe(true);
}

/* Systemnummeret etter NS 3451 står i punktnavnet: A_360_001_RT401, 320.012-RT402. Uten det havner punktet under «Annet». */
function sysNr(p) {
  const les = (t) => {
    const m = /(?:^|[^0-9])(\d{3})[._-](\d{3})(?![0-9])/.exec(t);
    if (m) return m[1] + '.' + m[2];
    const k = /(?:^|[^0-9A-Za-z])[Ss]?(3[1-8]0)([0-9]{2,3})(?![0-9])/.exec(t);   // S36026: system 360, nummer 026
    return k ? k[1] + '.' + k[2].padStart(3, '0') : '';
  };
  return les(String(p.name || '')) || les(String(p.description || ''));
}
const sysTittel = (nr) => { const t = SYSTEMTYPE[nr.slice(0, 3)]; return `<b>${esc(nr)}</b>${t ? ' · ' + esc(T(t[0], t[1])) : ''}`; };
const TYPENAVN = (t) => TYPEGRUPPE.pad.includes(t) ? T('Pådrag', 'Outputs') : T('Målinger', 'Inputs');

function tegPunktListe(ny) {
  const q = S.pFilter.toLowerCase();
  const l = S.punkter.filter(p => (S.typer === 'alle' || (S.typer === 'pad' ? TYPEGRUPPE.pad.includes(p.type) : TYPEGRUPPE.mal.includes(p.type)))
    && (!q || ((p.name || '') + ' ' + (p.description || '')).toLowerCase().includes(q)));
  const el = $('punktListe');
  if (!el) return;
  // Gruppering: system når navnene har systemnummer, ellers ingen. Brukeren kan bytte til type eller ingen.
  const antallSys = new Set(S.punkter.map(sysNr).filter(Boolean)).size;
  const gr = S.gruppe || (antallSys > 1 ? 'system' : 'ingen');
  const nokkelAv = gr === 'system' ? (p => sysNr(p) || 'zzz') : gr === 'type' ? (p => TYPEGRUPPE.pad.includes(p.type) ? '1' : '2') : null;
  const sortert = nokkelAv ? l.slice().sort((a, b) => nokkelAv(a).localeCompare(nokkelAv(b), undefined, {numeric: true}) || String(a.name || '').localeCompare(String(b.name || ''), undefined, {numeric: true})) : l;
  const vis = sortert.slice(0, nokkelAv ? 250 : 120);
  const rad = p => {
      const festet = erFestet({address: S.enhet.address, objid: p.objid});
      return sveipRad(`data-o="${esc(p.objid)}"`, `<button class="celle med-ikon" data-o="${esc(p.objid)}"><span class="ik${erUt(p.type) ? ' ut' : ''}">${typeKort(p.type)}</span>
      <span class="ct"><span class="ct1">${esc(p.name || p.objid)}</span><span class="ct2">${festet ? T('Festet · ', 'Pinned · ') : ''}${esc(p.description || p.objid)}</span></span>
      <span class="cv">${esc(fmt(p.value))}<small>${esc(sym(p))}</small></span>${CHEV}</button>`, [[festet ? 'losne' : 'fest', festet ? T('Løsne', 'Unpin') : T('Fest', 'Pin'), festet ? 'losne' : 'fest']]);
  };
  let liste = '';
  if (vis.length && nokkelAv) {
    const deler = new Map();
    for (const p of vis) { const k = nokkelAv(p); if (!deler.has(k)) deler.set(k, []); deler.get(k).push(p); }
    liste = [...deler].map(([k, ps]) => {
      const tittel = gr === 'system' ? (k === 'zzz' ? T('Annet', 'Other') : sysTittel(k)) : (k === '1' ? T('Pådrag', 'Outputs') : T('Målinger', 'Inputs'));
      const apen = !!q || !S.lukket.has('p:' + gr + k);
      return seksjonHode('p:' + gr + k, tittel, ps.length, apen) + (apen ? `<div class="liste${ny ? ' ny' : ''}">${ps.map(rad).join('')}</div>` : '');
    }).join('');
  } else if (vis.length) liste = `<div class="liste${ny ? ' ny' : ''}">${vis.map(rad).join('')}</div>`;
  el.innerHTML = vis.length ? `${liste}
      <div class="liste-fot">${l.length} ${T('punkter', 'points')}${l.length > vis.length ? T(' · viser ' + vis.length + ', søk for å snevre inn', ' · showing ' + vis.length + ', search to narrow') : ''} · ${T('sveip til venstre for å feste', 'swipe left to pin')}</div>`
    : tom(T('Ingen treff', 'No match'), T('Ingen punkter passer. Prøv «Alle», eller et annet ord.', 'No points match. Try “All”, or another word.'));
  if (ny && vis.length) el.querySelectorAll('.liste').forEach(x => stagger(x));
  el.onclick = e => {
    const g = e.target.closest('[data-gr]');
    if (g) { const k = g.dataset.gr; S.lukket.has(k) ? S.lukket.delete(k) : S.lukket.add(k); tegPunktListe(false); return; }
    const b = e.target.closest('button[data-o]'); if (b) { const p = S.punkter.find(x => x.objid === b.dataset.o); apneArk(lagPunkt(p, S.enhet)); }
  };
}

const lagPunkt = (p, d) => ({address: d.address, enhet: d.navn, instans: d.instans, objid: p.objid, type: p.type, name: p.name, beskrivelse: p.description,
  sym: sym(p), skrivbar: !!p.writable, verdi: p.value, enhetPunkter: d === S.enhet ? S.punkter : []});

/* ---------------------------------------------------------------- overstyrt */
async function lastMine() {
  try {
    const r = await api('/api/mine');
    S.mine = r.overstyrt || [];
  } catch { return; }
  const a = $('ant');
  if (a) { a.hidden = !S.mine.length; a.textContent = S.mine.length; }
  const sig = JSON.stringify(S.mine.map(o => [o.address, o.objid, o.priority, o.value]));
  if (S.tab === 'mine' && sig !== S.mineSig) tegMine();
  S.mineSig = sig;
}

function tegMine() {
  const m = $('innhold');
  navTilstand(TITLER().mine, null);
  S.mineSig = JSON.stringify(S.mine.map(o => [o.address, o.objid, o.priority, o.value]));
  if (!S.mine.length) {
    m.innerHTML = `<h1 class="stor-tittel">${TITLER().mine}</h1>` + tom(T('Ingenting er overstyrt', 'Nothing is overridden'),
      T('Her skal det være tomt før du drar. Det er det. Gå gjerne.', 'This should be empty before you leave. It is. You may go.'));
    m.onclick = null;
    return;
  }
  m.innerHTML = `<h1 class="stor-tittel">${TITLER().mine}</h1><div class="seksjon" style="margin-top:12px">${T('Står i manuell fra NABE på PC-en', 'In manual from NABE on the PC')}</div>
    <div class="liste ny">${S.mine.map((o, i) => sveipRad(`data-i="${i}"`, `<div class="celle med-ikon"><span class="ik ut">${SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')}</span>
      <span class="ct"><span class="ct1">${esc(navnFor(o))}</span><span class="ct2 mono">${esc(o.address)} · ${T('verdi', 'value')} ${esc(fmt(o.value))} · prio ${esc(o.priority)}</span></span>
      <button class="mini" data-slipp="${i}">${T('Slipp', 'Release')}</button></div>`, [['slipp', T('Slipp', 'Release'), 'slipp']])).join('')}</div>
    <div class="liste-fot" style="margin-top:-12px">${T('Sveip en rad til venstre for å slippe den', 'Swipe a row to the left to release it')}</div>
    <button class="knapp-stor" id="slippAlt">${T('Slipp alt (' + S.mine.length + ')', 'Release all (' + S.mine.length + ')')}</button>`;
  stagger(m.querySelector('.liste'));
  m.onclick = async e => {
    const b = e.target.closest('[data-slipp]');
    if (b) { const o = S.mine[+b.dataset.slipp]; await slipp(o.address, o.objid, o.priority); lastMine(); return; }
    if (e.target.id === 'slippAlt') {
      const liste = [...S.mine];   // fanget nå: listen kan fornyes mens du leser bekreftelsen
      if (!await bekreft('', T('Slipp alt', 'Release all'), {tittel: T('Slipper ' + liste.length + ' overstyringer', 'Releasing ' + liste.length + ' overrides'),
        broed: T('Anlegget går tilbake til sin egen styring på alle punktene.', 'The plant goes back to its own control on all the points.')})) return;
      for (const o of liste) await slipp(o.address, o.objid, o.priority);
      toast(T('Alt sluppet. Anlegget er sitt eget igjen.', 'All released. The plant is its own again.'));
      lastMine();
    }
  };
}

function navnFor(o) {
  const p = S.pins.find(x => x.address === o.address && x.objid === o.objid) || (S.enhet && S.enhet.address === o.address ? S.punkter.find(x => x.objid === o.objid) : null);
  return (p && p.name) || o.objid;
}

async function slipp(address, objid, priority) {
  const r = await api('/api/write', {address, objid, release: true, priority: priority || 8});
  toast(r.status === 'done' ? T('Sluppet', 'Released') : (r.error || T('Feilet', 'Failed')));
  return r;
}

// Det sveip og langt trykk kan gjøre.
async function utfoerHand(rot, id) {
  if (id === 'slipp') {
    const o = S.mine[+rot.dataset.i];
    if (o) { await slipp(o.address, o.objid, o.priority); lastMine(); }
  } else if (id === 'fest' || id === 'losne') {
    const p = S.punkter.find(x => x.objid === rot.dataset.o);
    if (!p || !S.enhet) return;
    const ny = festPunkt(lagPunkt(p, S.enhet));
    toast(ny ? T('Festet til Verdier', 'Pinned to Values') : T('Løsnet fra Verdier', 'Removed from Values'));
    tegPunktListe(false);
  }
}

function ctxMeny(w) {
  const p = S.pins[+w.dataset.k];
  if (!p) return;
  const r = w.getBoundingClientRect();
  const lag = document.createElement('div');
  lag.className = 'ctx';
  const klone = w.cloneNode(true);
  klone.classList.add('ctx-klone');
  klone.removeAttribute('data-k');
  klone.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  const lukk = (fn) => { lag.classList.add('ctx-lukker'); setTimeout(() => { lag.remove(); if (fn) fn(); }, 150); };
  const punkter = [[T('Åpne', 'Open'), 'aapne', () => apneArk(p)], [T('Løsne fra Verdier', 'Unpin from Values'), 'losne', () => { festPunkt(p); tegVerdier(); }]];
  if (S.skriv && (p.skrivbar || TYPEGRUPPE.pad.includes(p.type))) punkter.push([T('Slipp prioritet 8', 'Release priority 8'), 'laas', async () => { await slipp(p.address, p.objid, 8); lastMine(); }]);
  const meny = document.createElement('div');
  meny.className = 'ctx-meny';
  meny.innerHTML = punkter.map(([tekst, ik], i) => `<button data-i="${i}">${esc(tekst)}${IKON_MENY[ik]}</button>`).join('');
  lag.append(klone, meny);
  document.body.appendChild(lag);
  const mh = meny.offsetHeight || 150;
  const under = r.bottom + 12 + mh < window.innerHeight - 16;
  meny.style.top = (under ? r.bottom + 12 : Math.max(12, r.top - 12 - mh)) + 'px';
  meny.style.left = Math.min(Math.max(12, r.left), window.innerWidth - 242) + 'px';
  meny.style.transformOrigin = under ? 'top left' : 'bottom left';
  lag.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) lukk(punkter[+b.dataset.i][2]); else lukk(); };
  try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(12); } catch {}
}

/* --------------------------------------------------------------------- ark */
function lukkArk() {
  S.apent = null;
  S.test = (S.test && S.test.kjorer) ? S.test : null;
  $('ark').hidden = true;
  $('ark').style.background = '';
  const k = $('arkInn');
  k.style.transform = ''; k.style.transition = '';
  if (S.tab === 'verdier') oppdaterVerdier();
  if (S.tab === 'enheter' && S.enhet) tegPunktListe(false);
}

// Et handlingsark nedenfra, som iOS: valget øverst, Avbryt for seg selv under.
function bekreft(tekst, knapp, o = {}) {
  return new Promise(res => {
    const linjer = String(tekst).split(String.fromCharCode(10));
    const tittel = o.tittel || (linjer.length > 2 && linjer[0].length <= 90 ? linjer[0] : T('Bekreft', 'Confirm'));
    const broed = o.tittel ? (o.broed || String(tekst)) : (linjer.length > 2 && linjer[0].length <= 90 ? linjer.slice(1).join(String.fromCharCode(10)).replace(/^\s+/, '') : String(tekst));
    const kort = o.naa !== undefined ? `<div class="diff"><div><span class="merke">${T('Nå', 'Now')}</span><b>${esc(o.naa)}</b></div><span class="pil" aria-hidden="true">→</span>
      <div class="ny"><span class="merke">${T('Ny', 'New')}</span><b>${esc(o.ny)}</b></div></div>
      <div class="chips">${(o.chips || []).map(c => `<span class="chip2">${esc(c)}</span>`).join('')}</div>` : '';
    const b = document.createElement('div');
    b.className = 'as'; b.setAttribute('role', 'alertdialog'); b.setAttribute('aria-modal', 'true');
    b.innerHTML = `<div class="as-kort"><div class="as-topp"><h3>${esc(tittel)}</h3>${o.under ? `<div class="under">${esc(o.under)}</div>` : ''}${broed ? `<div class="tekst">${esc(broed)}</div>` : ''}</div>${kort}
      ${o.advarsel ? `<div class="advarsel"><span aria-hidden="true">!</span>${esc(o.advarsel)}</div>` : ''}
      <button class="as-knapp prim" id="bJa">${esc(knapp || 'OK')}</button></div>
      <div class="as-avbryt"><button class="as-knapp" id="bNei">${T('Avbryt', 'Cancel')}</button></div>`;
    document.body.appendChild(b);
    const ferdig = v => { b.remove(); res(v); };
    b.querySelector('#bNei').onclick = () => ferdig(false);
    b.querySelector('#bJa').onclick = () => ferdig(true);
    b.addEventListener('click', e => { if (e.target === b) ferdig(false); });
  });
}

function oppdaterArkVerdi() {
  const el = $('arkVerdi'), p = S.apent;
  if (!el || !p) return;
  const v = (S.vals[p.address] || {})[p.objid];
  el.innerHTML = esc(fmt(v === undefined ? p.verdi : v)) + `<small>${esc(p.sym || '')}</small>`;
  tegSpor(v === undefined ? p.verdi : v);
}

/* Hva verdien har gjort siden du åpnet punktet: står den, stiger den, eller pendler den? */
let spor = {nokkel: '', punkter: []};
function tegSpor(v) {
  const el = $('arkSpor'), p = S.apent;
  if (!el || !p || typeof v !== 'number') return;
  const nokkel = pinNokkel(p);
  if (spor.nokkel !== nokkel) spor = {nokkel, punkter: []};
  const naa = Date.now(), sist = spor.punkter[spor.punkter.length - 1];
  if (!sist || naa - sist[0] > 1500) spor.punkter.push([naa, v]);
  if (spor.punkter.length > 150) spor.punkter.shift();
  if (spor.punkter.length < 3) return;
  const verdier = spor.punkter.map(x => x[1]), lo = Math.min(...verdier), hi = Math.max(...verdier), t0 = spor.punkter[0][0], dt = Math.max(1, naa - t0), d = Math.max(hi - lo, Math.abs(hi) * 0.002, 0.1);
  const midt = (hi + lo) / 2;
  const xy = spor.punkter.map(([t, y]) => `${((t - t0) / dt * 300).toFixed(1)},${(23 - (y - midt) / d * 40).toFixed(1)}`).join(' ');
  const s = Math.round(dt / 1000);
  el.innerHTML = `<svg viewBox="0 0 300 46" preserveAspectRatio="none" aria-hidden="true"><polyline points="${xy}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div><span>${s < 120 ? s + ' s' : Math.round(s / 60) + ' min'}</span><span>${lo === hi ? T('uendret', 'unchanged') : esc(fmt(lo)) + ' – ' + esc(fmt(hi)) + ' ' + esc(p.sym || '')}</span></div>`;
}

const erAnalog = t => t === 'analog-output' || t === 'analog-value';
const erBinaer = t => t === 'binary-output' || t === 'binary-value';
const arkHode = (venstre, tittel, under, hoyre) => `<div class="grabber"></div><div class="ark-hode"><div>${venstre}</div><div class="ark-tittel">${esc(tittel)}${under ? `<small>${esc(under)}</small>` : ''}</div><div style="text-align:right">${hoyre}</div></div>`;

function apneArk(p) {
  S.apent = p;
  S.test = null;
  const festet = erFestet(p);
  const kanSkrive = p.skrivbar || TYPEGRUPPE.pad.includes(p.type);
  let skriv = '';
  if (kanSkrive && !S.skriv) {
    skriv = `<div class="seksjon">${T('Skriving', 'Writing')}</div><div class="liste"><div class="tekstcelle">${T('Skriving fra mobil er av. Slå den på i NABE på PC-en, under «Mobil».', 'Writing from mobile is off. Turn it on in NABE on the PC, under “Mobile”.')}</div></div>
      <div class="liste"><button class="celle" id="slippP" style="color:var(--tint)">${T('Slipp prioritet 8', 'Release priority 8')}</button></div>`;
  } else if (kanSkrive) {
    let inn = '';
    if (erAnalog(p.type)) {
      // Et pådrag i prosent får 0 til 100. Alt annet (settpunkt i grader, trykk) får steg opp og ned fra det som står.
      const prosent = p.sym === '%' || (!p.sym && p.type === 'analog-output');
      inn = `${prosent ? `<div class="seg" id="hurtig" style="margin-top:0">${[0, 25, 50, 75, 100].map(v => `<button data-q="${v}" aria-pressed="false">${v}</button>`).join('')}</div>`
        : `<div class="steg-rad">${[-1, -0.5, 0.5, 1].map(v => `<button type="button" data-steg="${v}">${v > 0 ? '+' : '−'}${String(Math.abs(v)).replace('.', T(',', '.'))}</button>`).join('')}</div>`}
        <div class="liste"><label class="celle"><span>${T('Verdi', 'Value')}</span><input id="skrivV" type="number" inputmode="decimal" step="any" placeholder="${T('Skriv et tall', 'Enter a number')}"></label></div>
        <button class="knapp-stor" id="settP">${T('Sett', 'Set')}</button>`;
    } else if (erBinaer(p.type)) {
      inn = `<div class="seg" style="margin-top:0"><button data-b="inactive" aria-pressed="false">${T('Av', 'Off')}</button><button data-b="active" aria-pressed="false">${T('På', 'On')}</button></div>`;
    } else {
      inn = `<div class="liste"><label class="celle"><span>${T('Verdi', 'Value')}</span><input id="skrivV" type="number" inputmode="numeric" step="1" placeholder="${T('Skriv et tall', 'Enter a number')}"></label></div>
        <button class="knapp-stor" id="settP">${T('Sett', 'Set')}</button>`;
    }
    skriv = `<div class="seksjon">${T('Sett verdi', 'Set value')}</div>${inn}
      <div class="liste-fot" style="margin-top:-6px">${T('Prioritet 8. Slippes av seg selv etter ' + S.maks + ' min, også hvis du mister dekning.', 'Priority 8. Released automatically after ' + S.maks + ' min, even if you lose coverage.')}</div>
      <button class="knapp-stor lys" id="slippP">${T('Slipp', 'Release')}</button>`;
    if (p.type === 'analog-output' || p.type === 'analog-value') {
      const maal = (p.enhetPunkter || []).filter(x => ['analog-input', 'analog-value', 'analog-output'].includes(x.type) && x.objid !== p.objid);
      if (maal.length) {
        skriv += `<div class="seksjon">${T('Prøv og se svar', 'Try and see the response')}</div>
          <div class="liste"><div class="tekstcelle">${T('Setter pådraget til 0, 50 og 100 % med pause imellom, og måler hvor fort og hvor mye måleverdien svarer.', 'Sets the output to 0, 50 and 100 % with a pause between, and measures how fast and how much the measurement responds.')}</div>
            <label class="celle"><span>${T('Måling', 'Measurement')}</span><select id="maalSel">${maal.slice().sort((a, b) => likhet(p, b) - likhet(p, a)).map(x => `<option value="${esc(x.objid)}">${esc(x.name || x.objid)}</option>`).join('')}</select></label>
            <label class="celle"><span>${T('Pause per trinn', 'Pause per step')}</span><select id="pauseSel">${[15, 30, 45, 60, 90].map(s => `<option value="${s}"${s === 30 ? ' selected' : ''}>${s} s</option>`).join('')}</select></label></div>
          <button class="knapp-stor lys" id="provP">${T('Prøv og se svar…', 'Try and see response…')}</button>`;
      }
    }
  }
  $('arkInn').innerHTML = arkHode(`<button class="tekstknapp" id="festP">${festet ? T('Løsne', 'Unpin') : T('Fest', 'Pin')}</button>`, p.name || p.objid, p.enhet || p.address,
      `<button class="tekstknapp fet" id="lukkP">${T('Ferdig', 'Done')}</button>`)
    + `<div class="ark-kropp"><div class="verdi-stor" id="arkVerdi"></div><div class="spor" id="arkSpor"></div><div class="verdi-under">${esc(p.objid)}</div>${p.beskrivelse ? `<div class="verdi-besk">${esc(p.beskrivelse)}</div>` : ''}${skriv}</div>`;
  $('arkInn').scrollTop = 0;
  $('ark').hidden = false;
  oppdaterArkVerdi();
  pollVerdier();
  segTommel($('hurtig'), false);
  $('lukkP').onclick = lukkArk;
  $('festP').onclick = () => {
    const ny = festPunkt(p);
    toast(ny ? T('Festet til Verdier', 'Pinned to Values') : T('Løsnet fra Verdier', 'Removed from Values'));
    apneArk(p);
  };
  if ($('slippP')) $('slippP').onclick = async () => { await slipp(p.address, p.objid, 8); lastMine(); };
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    $('skrivV').value = b.dataset.q;
    document.querySelectorAll('#hurtig button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    segTommel($('hurtig'));
  });
  document.querySelectorAll('[data-steg]').forEach(b => b.onclick = () => {
    // Fra det som står i feltet, ellers fra verdien nå. Ingenting sendes før du trykker Sett.
    const naa = (S.vals[p.address] || {})[p.objid];
    const fra = $('skrivV').value !== '' ? parseFloat($('skrivV').value) : (typeof naa === 'number' ? naa : typeof p.verdi === 'number' ? p.verdi : 0);
    $('skrivV').value = Math.round((fra + parseFloat(b.dataset.steg)) * 10) / 10;
  });
  document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => skrivVerdi(p, b.dataset.b));
  if ($('settP')) $('settP').onclick = () => { const v = $('skrivV').value; if (v === '') return toast(T('Skriv en verdi først', 'Enter a value first')); skrivVerdi(p, erAnalog(p.type) || /^multi/.test(p.type) ? parseFloat(v) : v); };
  if ($('provP')) $('provP').onclick = () => provSvar(p);
}

function likhet(p, q) {
  const a = (p.name || '').toLowerCase().replace(/[^a-z0-9æøå]/g, ''), b = (q.name || '').toLowerCase().replace(/[^a-z0-9æøå]/g, '');
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i + (q.type === 'analog-input' ? 0.5 : 0);
}

async function skrivVerdi(p, v) {
  const naa = (S.vals[p.address] || {})[p.objid];
  const vtxt = typeof v === 'string' ? fmt(v) : v;
  if (!await bekreft('', T('Skriv', 'Write'), {tittel: T('Skriver til anlegget', 'Writing to the plant'), under: (p.name || p.objid) + ' · ' + p.address,
    naa: fmt(naa) + (p.sym ? ' ' + p.sym : ''), ny: vtxt + (p.sym ? ' ' + p.sym : ''),
    chips: [T('Prioritet 8', 'Priority 8'), T('Slippes automatisk etter ' + S.maks + ' min', 'Released automatically after ' + S.maks + ' min')],
    advarsel: T('Dette endrer et anlegg i drift.', 'This changes a plant in operation.')})) return;
  const r = await api('/api/write', {address: p.address, objid: p.objid, value: v, priority: 8, auto_release_min: S.maks});
  hapt(r.status === 'done' ? 14 : [50, 40, 50]);
  toast(r.status === 'done' ? T('Satt. Slippes om ' + (r.auto_release_min || S.maks) + ' min, selv om du glemmer det.', 'Set. Released in ' + (r.auto_release_min || S.maks) + ' min, even if you forget.') : (r.error || T('Feilet', 'Failed')));
  lastMine(); pollVerdier();
}

/* ------------------------------------------------------- prøv og se svar */
async function provSvar(p) {
  const maal = $('maalSel').value, pause = +$('pauseSel').value;
  const m = (p.enhetPunkter || []).find(x => x.objid === maal) || {name: maal};
  const trinn = [0, 50, 100];
  const sek = 6 + trinn.length * pause;
  if (!await bekreft('', T('Start testen', 'Start the test'), {tittel: T('Prøv og se svar', 'Try and see response'),
    under: (p.name || p.objid) + ' → ' + (m.name || maal),
    broed: `${T('Trinn', 'Steps')}: ${trinn.join(', ')} %   ·   ${T('Tid', 'Time')}: ${Math.ceil(sek / 60 * 10) / 10} min\n\n${T('Pådraget settes i manuell (prioritet 8) og slippes automatisk når testen er ferdig, avbrutt eller feiler. Anlegget kan reagere kraftig.', 'The output is put in manual (priority 8) and released automatically when the test finishes, is cancelled or fails. The plant may react strongly.')}`,
    advarsel: T('Dette endrer et anlegg i drift.', 'This changes a plant in operation.')})) return;
  const r = await api('/api/test/svar', {address: p.address, padrag: p.objid, maaling: maal, trinn, pause_s: pause, prioritet: 8,
    enhet_navn: p.enhet || null, padrag_navn: p.name || null, maaling_navn: m.name || null, via: 'mobil'});
  if (r.status !== 'started') return toast(r.error || T('Kunne ikke starte', 'Could not start'));
  S.test = {id: r.id, maaling: maal, maaling_address: p.address, kjorer: true, p, pause, trinn, navnMaal: m.name || maal};
  tegTest();
  S.test.lop = setInterval(async () => {
    const j = await api('/api/test/svar/' + r.id).catch(() => null);
    if (!j || j.status !== 'done') return;
    S.test.d = j.test;
    if (j.test.status !== 'kjorer' && j.test.fase === 'ferdig') {
      S.test.kjorer = false; clearInterval(S.test.lop); lastMine(); oppdaterVaken();
      hapt(j.test.status === 'ferdig' ? [20, 60, 20] : [60, 40, 60]);
      // Forrige test på samme pådrag og måling, så resultatet kan sammenlignes før og etter en justering.
      const h = await api('/api/test/svar-historikk?padrag=' + encodeURIComponent(S.test.p.objid) + '&address=' + encodeURIComponent(S.test.p.address)
        + '&maaling=' + encodeURIComponent(S.test.maaling)).catch(() => null);
      if (S.test && h && h.tester) S.test.forrige = h.tester.find(x => x.id !== r.id && x.resultat && x.resultat.dom !== 'ingen') || null;
    }
    tegTest();
  }, 1000);
}

// Før og etter: samme tall fra forrige test ved siden av dette, med forskjellen.
function forEtter(f, n) {
  if (!f || !f.resultat || !n || n.dom === 'ingen') return '';
  const rad = (navn, a, b, enhet) => {
    const d = (a != null && b != null) ? Math.round((b - a) * 100) / 100 : null;
    const pil = d === null ? '–' : d === 0 ? '=' : d > 0 ? '▲ +' + d : '▼ ' + d;
    const v = x => x == null ? '–' : x + enhet;
    return `<div class="test-rad"><span>${navn}</span><span>${v(a)}</span><span>${v(b)}</span><span>${pil}</span></div>`;
  };
  const a = f.resultat, dato = new Date(f.t * 1000);
  const nar = dato.toDateString() === new Date().toDateString() ? dato.toTimeString().slice(0, 5) : dato.toLocaleDateString();
  return `<div class="seksjon">${T('Før og etter', 'Before and after')} · ${T('forrige test', 'previous test')} ${esc(nar)}</div><div class="liste">
    <div class="test-rad hode"><span></span><span>${T('Før', 'Before')}</span><span>${T('Nå', 'Now')}</span><span>${T('Endring', 'Change')}</span></div>
    ${rad(T('Per 10 %', 'Per 10 %'), a.per_10, n.per_10, '')}${rad(T('Dødtid', 'Dead time'), a.dode_s, n.dode_s, ' s')}${rad('63 %', a.t63_s, n.t63_s, ' s')}</div>`;
}

function graf(serie, trinnT) {
  const pts = serie.filter(s => s.v != null);
  if (pts.length < 2) return '<svg class="graf"></svg>';
  const xs = pts.map(s => s.t), ys = pts.map(s => s.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 320, Hh = 110, pad = 10;
  const X = t => pad + (t - x0) / Math.max(1e-9, x1 - x0) * (W - 2 * pad);
  const Y = v => Hh - pad - (v - y0) / Math.max(1e-9, y1 - y0) * (Hh - 2 * pad);
  const linjer = (trinnT || []).map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${Hh}" stroke="var(--sep)" stroke-width=".8" stroke-dasharray="3 3"/>`).join('');
  return `<svg class="graf" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${linjer}<polyline fill="none" stroke="var(--tint)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(s => X(s.t).toFixed(1) + ',' + Y(s.v).toFixed(1)).join(' ')}"/></svg>`;
}

function domTekst(r, pause) {
  if (!r) return '';
  if (r.dom === 'ingen') return T('Ingen tydelig respons. Måleverdien endret seg ikke mer enn støyen, så enten er pådraget ikke koblet til denne målingen, eller utstyret går ikke. Anlegget sier ingenting. Det gjør det ofte.', 'No clear response. The measurement did not move more than the noise, so either the output is not connected to this measurement or the equipment is not running. The plant says nothing. It often does.');
  const rett = r.retning === 'opp' ? T('stiger', 'rises') : T('synker', 'falls');
  const lin = r.lineaer === true ? T(' Svaret er jevnt (like mye per trinn).', ' The response is even (the same per step).') : r.lineaer === false ? T(' Svaret er ujevnt: trinnene gir ulik effekt.', ' The response is uneven: the steps give different effects.') : '';
  const uten = r.uten_svar && r.uten_svar.length ? T(' ' + r.uten_svar.length + ' trinn ga ingen respons.', ' ' + r.uten_svar.length + ' step(s) gave no response.') : '';
  const pr = r.per_10 != null ? Math.abs(r.per_10).toFixed(2) : '?';
  return T(`Måleverdien ${rett} omtrent ${pr} per 10 % pådrag. Dødtid ${r.dode_s != null ? r.dode_s + ' s' : '?'}, 63 % av endringen etter ${r.t63_s != null ? r.t63_s + ' s' : '?'}.`,
    `The measurement ${rett} about ${pr} per 10 % of output. Dead time ${r.dode_s != null ? r.dode_s + ' s' : '?'}, 63 % of the change after ${r.t63_s != null ? r.t63_s + ' s' : '?'}.`)
    + lin + uten + (r.dom === 'ok' ? T(' Dette kan du skrive i protokollen uten å rødme.', ' You can put this in the protocol without blushing.') : '') + (r.dom === 'treg' ? T(' Svaret er tregt i forhold til pausen, så resultatet kan være avkortet. Prøv lengre pause. Ikke alt har det like travelt som du.', ' The response is slow compared to the pause, so the result may be cut short. Try a longer pause. Not everything is in as much of a hurry as you.') : '');
}

function tegTest() {
  const t = S.test;
  if (!t) return;
  const d = t.d || {serie: [], steg: [], fase: 'hvile', status: 'kjorer', trinn: t.trinn};
  let fase = '';
  if (d.status === 'kjorer') fase = d.fase === 'hvile' ? T('Måler hvilenivå…', 'Measuring rest level…') : d.fase === 'trinn' ? T('Trinn ' + (d.trinn_i + 1) + ' av ' + d.trinn.length + ': pådrag ' + d.trinn[d.trinn_i] + ' %', 'Step ' + (d.trinn_i + 1) + ' of ' + d.trinn.length + ': output ' + d.trinn[d.trinn_i] + ' %') : T('Slipper…', 'Releasing…');
  else if (d.fase !== 'ferdig') fase = T('Slipper pådraget…', 'Releasing the output…');
  const trinnT = []; let sist = null;
  d.serie.forEach(s => { if (s.trinn !== sist) { trinnT.push(s.t); sist = s.trinn; } });
  const siste = d.serie.length ? d.serie[d.serie.length - 1].v : null;
  const ferdig = d.status !== 'kjorer' && d.fase === 'ferdig';
  const tittel = d.status === 'feil' ? T('Testen stoppet', 'The test stopped') : d.status === 'avbrutt' ? T('Avbrutt', 'Cancelled') : ferdig ? T('Ferdig', 'Done') : T('Testen går', 'Test running');
  const rull = $('arkInn').scrollTop;
  $('arkInn').innerHTML = arkHode(ferdig ? '' : `<button class="tekstknapp" id="tAvbryt" style="color:var(--err)">${T('Avbryt', 'Cancel')}</button>`, tittel, `${t.p.name || t.p.objid} → ${t.navnMaal}`,
      ferdig ? `<button class="tekstknapp fet" id="tLukk">${T('Ferdig', 'Done')}</button>` : '')
    + `<div class="ark-kropp"><div class="verdi-stor">${esc(fmt(siste))}<small>${esc(t.p.sym || '')}</small></div>
    <div class="graf-boks">${graf(d.serie, trinnT)}</div>
    <div class="fase">${esc(fase)}</div>
    ${d.feil ? `<div class="feil">${esc(d.feil)}</div>` : ''}
    ${d.steg.length ? `<div class="liste"><div class="test-rad hode"><span>${T('Trinn', 'Step')}</span><span>${T('Endring', 'Change')}</span><span>${T('Dødtid', 'Dead')}</span><span>63 %</span></div>${d.steg.map(s => `<div class="test-rad"><span>${s.til} %</span>
      <span>${s.reagerte ? (s.endring > 0 ? '+' : '') + s.endring : T('ingen', 'none')}</span><span>${s.dode_s != null ? s.dode_s + ' s' : '–'}</span><span>${s.t63_s != null ? s.t63_s + ' s' : '–'}</span></div>`).join('')}</div>` : ''}
    ${ferdig && d.resultat ? `<div class="liste"><div class="dom">${esc(domTekst(d.resultat, t.pause))}</div></div>` : ''}
    ${ferdig ? forEtter(t.forrige, d.resultat) : ''}
    ${S.borte && !ferdig ? `<div class="liste-fot">${T('Mistet kontakten. Testen går videre på PC-en og slipper pådraget selv når den er ferdig.', 'Lost contact. The test carries on on the PC and releases the output by itself when done.')}</div>` : ''}
    ${ferdig ? `<div class="liste-fot" style="margin-top:-10px">${d.sluppet ? T('Pådraget er sluppet tilbake til anlegget.', 'The output has been released back to the plant.') : T('Pådraget ble ikke bekreftet sluppet. Sjekk fanen Overstyrt.', 'The release was not confirmed. Check the Overridden tab.')}</div>` : ''}
    ${ferdig ? `<button class="knapp-stor" id="tLukk2">${T('Ferdig', 'Done')}</button>` : `<button class="knapp-stor fare" id="tAvbryt2">${T('Avbryt og slipp', 'Cancel and release')}</button>`}</div>`;
  $('arkInn').scrollTop = rull;
  const avbryt = () => api('/api/test/svar/' + t.id + '/avbryt', {});
  const lukk = () => { S.test = null; lukkArk(); };
  if ($('tAvbryt')) $('tAvbryt').onclick = avbryt;
  if ($('tAvbryt2')) $('tAvbryt2').onclick = avbryt;
  if ($('tLukk')) $('tLukk').onclick = lukk;
  if ($('tLukk2')) $('tLukk2').onclick = lukk;
  $('ark').hidden = false;
}

/* ------------------------------------------------------------ bevegelser */
// Alt som føles som en vanlig app: sveip på rader, kantsveip tilbake, sveip mellom faner,
// trekk for å oppdatere, langt trykk på en widget og ark du kan dra ned.
function gester() {
  if (gester.ok) return;
  gester.ok = true;

  /* ---- sveip på rader: dra til venstre for handlingene, dra langt for å utføre den første */
  let sv = null, sistSveip = 0;
  const lukkRad = rot => { rot.classList.remove('aapen'); rot.querySelector('.sveip-inn').style.transform = ''; };
  const aapneRad = rot => { rot.classList.add('aapen'); rot.querySelector('.sveip-inn').style.transform = `translateX(${-rot.querySelector('.sveip-hand').offsetWidth}px)`; };
  document.addEventListener('pointerdown', e => {
    const inn = e.target.closest('.sveip-inn');
    document.querySelectorAll('.sveip.aapen').forEach(r => { if (!inn || r !== inn.parentElement) lukkRad(r); });
    if (!inn || e.target.closest('.sveip-hand')) return;
    const rot = inn.parentElement, h = rot.querySelector('.sveip-hand');
    sv = {inn, rot, x0: e.clientX, y0: e.clientY, off: rot.classList.contains('aapen') ? -h.offsetWidth : 0, drar: false, id: e.pointerId, bredde: rot.offsetWidth, hbr: h.offsetWidth, x: 0};
  }, true);
  document.addEventListener('pointermove', e => {
    const a = sv;
    if (!a || e.pointerId !== a.id) return;
    const dx = e.clientX - a.x0, dy = e.clientY - a.y0;
    if (!a.drar) {
      if (Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy) * 1.4) { a.drar = true; a.inn.classList.add('drar'); a.rot.classList.add('drar'); try { a.inn.setPointerCapture(e.pointerId); } catch {} }
      else { if (Math.abs(dy) > 12) sv = null; return; }
    }
    let x = Math.min(0, a.off + dx);
    if (x < -a.hbr) x = -a.hbr + (x + a.hbr) * 0.6;
    a.x = x;
    a.inn.style.transform = `translateX(${x}px)`;
  }, true);
  const sveipSlutt = () => {
    const a = sv;
    if (!a) return;
    sv = null;
    a.inn.classList.remove('drar'); a.rot.classList.remove('drar');
    if (!a.drar) return;
    sistSveip = Date.now();
    if (a.x < -a.bredde * 0.6) { lukkRad(a.rot); const f = a.rot.querySelector('.sveip-hand button'); if (f) utfoerHand(a.rot, f.dataset.h); }
    else if (a.x < -a.hbr * 0.45) aapneRad(a.rot);
    else lukkRad(a.rot);
  };
  document.addEventListener('pointerup', sveipSlutt, true);
  document.addEventListener('pointercancel', sveipSlutt, true);
  document.addEventListener('click', e => {
    if (Date.now() - sistSveip < 380) { e.stopPropagation(); e.preventDefault(); return; }
    const h = e.target.closest('.sveip-hand button');
    if (h) { const rot = h.closest('.sveip'); lukkRad(rot); utfoerHand(rot, h.dataset.h); e.stopPropagation(); return; }
    const rot = e.target.closest('.sveip.aapen');
    if (rot) { lukkRad(rot); e.stopPropagation(); e.preventDefault(); }
  }, true);

  /* ---- sveip fra venstre kant for å gå tilbake, og sveip sideveis for å bytte fane */
  let sk = null;
  document.addEventListener('pointerdown', e => {
    if (!$('ark').hidden || document.querySelector('.as, .ctx') || e.target.closest('input, select, textarea, .seg, .tabbar, .nav')) { sk = null; return; }
    const kant = e.clientX < 24 && S.tab === 'enheter' && !!S.enhet;
    if (!kant && e.target.closest('.sveip-inn, .widget')) { if (!e.target.closest('.sveip-inn')) { /* widget: tillat fane-sveip */ } else { sk = null; return; } }
    sk = {x0: e.clientX, y0: e.clientY, id: e.pointerId, kant, drar: false, dx: 0, t0: performance.now()};
  }, true);
  document.addEventListener('pointermove', e => {
    const a = sk;
    if (!a || e.pointerId !== a.id) return;
    const dx = e.clientX - a.x0, dy = e.clientY - a.y0;
    a.dx = dx;
    if (!a.kant) return;
    if (!a.drar) { if (dx > 8 && dx > Math.abs(dy)) a.drar = true; else if (Math.abs(dy) > 14) { sk = null; return; } else return; }
    const m = $('innhold');
    m.style.transition = 'none';
    m.style.transform = `translateX(${Math.max(0, dx)}px)`;
    m.style.opacity = String(1 - Math.min(0.6, dx / window.innerWidth));
  }, true);
  const skSlutt = e => {
    const a = sk;
    if (!a) return;
    sk = null;
    const dt = Math.max(1, performance.now() - a.t0), m = $('innhold');
    if (a.kant && a.drar) {
      const fort = a.dx / dt > 0.5;
      m.style.transition = 'transform .28s cubic-bezier(.2,.9,.25,1), opacity .28s';
      if (a.dx > window.innerWidth * 0.33 || fort) {
        m.style.transform = `translateX(${window.innerWidth}px)`; m.style.opacity = '0';
        setTimeout(() => { m.style.transition = 'none'; m.style.transform = ''; m.style.opacity = ''; tilbakeTilEnheter(); }, 240);
      } else { m.style.transform = ''; m.style.opacity = ''; setTimeout(() => { m.style.transition = ''; }, 300); }
      sistSveip = Date.now();
      return;
    }
    if (!a.kant && !S.enhet) {
      const dy = (e && e.clientY != null) ? e.clientY - a.y0 : 0;
      if (Math.abs(a.dx) > 90 && Math.abs(a.dx) > Math.abs(dy) * 2.2) {
        const i = FANER.indexOf(S.tab), ny = FANER[i + (a.dx < 0 ? 1 : -1)];
        if (ny) { sistSveip = Date.now(); bytteTab(ny); }
      }
    }
  };
  document.addEventListener('pointerup', skSlutt, true);
  document.addEventListener('pointercancel', () => { sk = null; const m = $('innhold'); if (m) { m.style.transform = ''; m.style.opacity = ''; m.style.transition = ''; } }, true);

  /* ---- trekk for å oppdatere */
  let pt = null;
  document.addEventListener('touchstart', e => {
    if (window.scrollY > 0 || e.touches.length !== 1 || !$('ark').hidden || (S.enhet && S.tab === 'enheter') || document.querySelector('.as, .ctx') || e.target.closest('.sveip-inn, .seg, input')) { pt = null; return; }
    pt = {y0: e.touches[0].clientY, x0: e.touches[0].clientX, d: 0, aktiv: false};
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if (!pt) return;
    const dy = e.touches[0].clientY - pt.y0, dx = e.touches[0].clientX - pt.x0;
    if (!pt.aktiv) {
      if (dy > 10 && dy > Math.abs(dx) * 1.5 && window.scrollY <= 0) pt.aktiv = true;
      else { if (dy < -4 || Math.abs(dx) > 14) pt = null; return; }
    }
    if (e.cancelable) e.preventDefault();
    pt.d = Math.min(96, dy * 0.5);
    const m = $('innhold'), p = $('ptr');
    m.style.transition = 'none';
    m.style.transform = `translateY(${pt.d}px)`;
    p.style.opacity = String(Math.min(1, pt.d / 46));
    p.style.transform = `translateY(${pt.d * 0.5}px) rotate(${pt.d * 5}deg)`;
  }, {passive: false});
  document.addEventListener('touchend', async () => {
    const a = pt;
    pt = null;
    if (!a || !a.aktiv) return;
    const m = $('innhold'), p = $('ptr');
    m.style.transition = 'transform .38s cubic-bezier(.2,.9,.25,1)';
    if (a.d >= 54) {
      m.style.transform = 'translateY(54px)';
      p.classList.add('snurr'); p.style.opacity = '1'; p.style.transform = 'translateY(28px)';
      await Promise.all([oppdaterSide(), new Promise(r => setTimeout(r, 800))]);
      p.classList.remove('snurr');
    }
    m.style.transform = ''; p.style.opacity = '0'; p.style.transform = '';
    setTimeout(() => { m.style.transition = ''; }, 400);
  });
  document.addEventListener('touchcancel', () => { pt = null; const m = $('innhold'); if (m) { m.style.transform = ''; m.style.transition = ''; } $('ptr').style.opacity = '0'; });

  /* ---- langt trykk på en widget gir en meny */
  let lt = null, sistLangt = 0;
  document.addEventListener('pointerdown', e => {
    const w = e.target.closest('.widget');
    if (!w) return;
    lt = {w, x: e.clientX, y: e.clientY, t: setTimeout(() => { sistLangt = Date.now(); const ww = lt && lt.w; lt = null; if (ww) ctxMeny(ww); }, 430)};
  }, true);
  const ltAvbryt = () => { if (lt) { clearTimeout(lt.t); lt = null; } };
  document.addEventListener('pointermove', e => { if (lt && (Math.abs(e.clientX - lt.x) > 8 || Math.abs(e.clientY - lt.y) > 8)) ltAvbryt(); }, true);
  document.addEventListener('pointerup', ltAvbryt, true);
  document.addEventListener('pointercancel', ltAvbryt, true);
  document.addEventListener('click', e => { if (Date.now() - sistLangt < 600) { e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('contextmenu', e => { if (e.target.closest('.widget, .sveip-inn')) e.preventDefault(); });

  /* ---- arket kan dras ned: mørket bak blekner med fingeren, og et raskt dytt lukker */
  let ar = null;
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('.grabber, .ark-hode');
    if (!h || e.target.closest('button') || $('ark').hidden) return;
    const kort = $('arkInn');
    ar = {id: e.pointerId, y0: e.clientY, dy: 0, t0: performance.now(), kort, h};
    kort.style.transition = 'none';
    try { h.setPointerCapture(e.pointerId); } catch {}
  }, true);
  document.addEventListener('pointermove', e => {
    if (!ar || e.pointerId !== ar.id) return;
    const rå = e.clientY - ar.y0;
    ar.dy = rå > 0 ? rå : rå * 0.2;
    ar.kort.style.transform = `translateY(${ar.dy}px)`;
    $('ark').style.background = `rgba(0,0,0,${0.42 * (1 - Math.min(1, Math.max(0, ar.dy) / 460))})`;
  }, true);
  const arSlutt = () => {
    const a = ar;
    if (!a) return;
    ar = null;
    const v = a.dy / Math.max(1, performance.now() - a.t0);
    if (a.dy > 130 || (a.dy > 36 && v > 0.55)) {
      a.kort.style.transition = 'transform .3s cubic-bezier(.4,0,1,1)';
      a.kort.style.transform = 'translateY(105%)';
      $('ark').style.transition = 'background .3s';
      $('ark').style.background = 'rgba(0,0,0,0)';
      setTimeout(() => { $('ark').style.transition = ''; lukkArk(); }, 280);
    } else {
      a.kort.style.transition = 'transform .38s cubic-bezier(.2,1.1,.3,1)';
      a.kort.style.transform = '';
      $('ark').style.background = '';
      setTimeout(() => { a.kort.style.transition = ''; }, 400);
    }
  };
  document.addEventListener('pointerup', arSlutt, true);
  document.addEventListener('pointercancel', arSlutt, true);
}

/* ---------------------------------------------------------------------- start */
async function status() {
  try {
    const r = await api('/api/readonly');
    S.readonly = !!r.enabled;
    const m = await hentMedFrist('/m/me', {}, 10000).then(x => x.json()).catch(() => ({}));
    if (m.ok) {
      S.skriv = !!m.skriv; S.maks = m.maks_min || 10;
      const foer = (S.aktiv || {}).address;
      S.aktiv = m.aktiv || null;
      // Byttet enhet på PC-en: snarveien følger med mens lista står oppe
      if (foer !== (S.aktiv || {}).address && S.tab === 'enheter' && !S.enhet && $('enhetListe')) tegEnhetListe(false);
    }
  } catch {}
  pille();
}

let startTikk = 0, faste = false;
async function start() {
  clearTimeout(startTikk);
  let me;
  try { me = await hentMedFrist('/m/me', {}, 10000); }
  catch {
    // Ingen kontakt ved åpning (dårlig dekning, Tailscale av): si hva som kan være galt, og prøv igjen
    $('rot').innerHTML = `<div class="logg">${ANSIKT}<h1>NABE</h1><p>${T('Får ikke kontakt med PC-en. Prøver igjen.', 'Cannot reach the PC. Retrying.')}</p><p>${kontaktTips(location.hostname)}</p><button type="button" class="knapp-stor" id="startIgjen">${T('Prøv nå', 'Retry')}</button></div>`;
    $('startIgjen').onclick = start;
    startTikk = setTimeout(start, 4000);
    return;
  }
  if (me.status !== 401) {
    S.inne = true;
    ramme();
    await status();
    try { await lastEnheter(); } catch {}
    teg();
    lastMine();
    pollVerdier();
    pollNeste();
    if (!faste) {
      faste = true;
      setInterval(() => { if (S.inne && !document.hidden) lastMine(); }, 15000);
      setInterval(() => { if (S.inne && !document.hidden) status(); }, 10000);
    }
    oppdaterVaken();
  } else {
    visLogin(new URLSearchParams(location.search).get('feil') ? T('Feil kode, eller koden er utløpt.', 'Wrong code, or the code has expired.') : '');
  }
}
start();
</script>
